name: agentium

services:
  agentium-frontend:
    image: agentium-frontend:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-frontend
      args:
        AGENTIUM_IMAGE_REVISION: ${AGENTIUM_IMAGE_REVISION:-unknown}
    container_name: agentium-frontend
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_FRONTEND_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-rabbitmq:
    image: rabbitmq:4.1-management
    container_name: agentium-rabbitmq
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${AGENTIUM_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - agentium_rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${AGENTIUM_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${AGENTIUM_RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-livekit:
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-v1.12.0}
    container_name: agentium-livekit
    restart: unless-stopped
    profiles: ["realtime"]
    networks:
      - agentium-net
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        yaml_quote() {
          printf "%s" "$$1" | sed "s/'/''/g"
        }
        redis_block=""
        if [ -n "$${LIVEKIT_REDIS_ADDRESS:-}" ]; then
          redis_block="$$(printf "redis:\n  address: '%s'" "$$(yaml_quote "$$LIVEKIT_REDIS_ADDRESS")")"
          if [ -n "$${LIVEKIT_REDIS_USERNAME:-}" ]; then
            redis_block="$$(printf "%s\n  username: '%s'" "$$redis_block" "$$(yaml_quote "$$LIVEKIT_REDIS_USERNAME")")"
          fi
          if [ -n "$${LIVEKIT_REDIS_PASSWORD:-}" ]; then
            redis_block="$$(printf "%s\n  password: '%s'" "$$redis_block" "$$(yaml_quote "$$LIVEKIT_REDIS_PASSWORD")")"
          fi
          if [ -n "$${LIVEKIT_REDIS_DB:-}" ]; then
            redis_block="$$(printf "%s\n  db: %s" "$$redis_block" "$$LIVEKIT_REDIS_DB")"
          fi
        fi
        if [ -n "$${LIVEKIT_KEYS:-}" ]; then
          LIVEKIT_KEYS="$$(printf "%s" "$$LIVEKIT_KEYS" | sed -E 's/:([^[:space:]])/: \1/g')"
        fi
        if ! printf "%s" "$${LIVEKIT_KEYS:-}" | grep -Eq '^[^[:space:]:]+: [^[:space:]].*'; then
          LIVEKIT_KEYS="$${LIVEKIT_API_KEY:-devkey}: $${LIVEKIT_API_SECRET:-change-me-livekit-secret-at-least-32-chars}"
        fi
        export LIVEKIT_KEYS
        test -n "$${LIVEKIT_WEBHOOK_API_KEY:-$${LIVEKIT_API_KEY:-devkey}}"
        awk \
          -v webhook_key="$${LIVEKIT_WEBHOOK_API_KEY:-$${LIVEKIT_API_KEY:-devkey}}" \
          -v redis_block="$$redis_block" \
          -v rtc_tcp_port="$${LIVEKIT_RTC_TCP_PORT:-7881}" \
          -v rtc_udp_start="$${LIVEKIT_RTC_UDP_RANGE_START:-50000}" \
          -v rtc_udp_end="$${LIVEKIT_RTC_UDP_RANGE_END:-50100}" \
          '{ gsub("__LIVEKIT_WEBHOOK_API_KEY__", webhook_key); gsub("__LIVEKIT_REDIS_BLOCK__", redis_block); gsub("__LIVEKIT_RTC_TCP_PORT__", rtc_tcp_port); gsub("__LIVEKIT_RTC_UDP_RANGE_START__", rtc_udp_start); gsub("__LIVEKIT_RTC_UDP_RANGE_END__", rtc_udp_end); print }' \
          /etc/livekit/agentium-livekit.yaml > /tmp/agentium-livekit.yaml
        exec /livekit-server --config /tmp/agentium-livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change-me-livekit-secret-at-least-32-chars}
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:-}
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_WEBHOOK_API_KEY:-${LIVEKIT_API_KEY:-devkey}}
      LIVEKIT_REDIS_ADDRESS: ${LIVEKIT_REDIS_ADDRESS:-}
      LIVEKIT_REDIS_USERNAME: ${LIVEKIT_REDIS_USERNAME:-}
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD:-}
      LIVEKIT_REDIS_DB: ${LIVEKIT_REDIS_DB:-}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_RTC_TCP_PORT:-7881}
      LIVEKIT_RTC_UDP_RANGE_START: ${LIVEKIT_RTC_UDP_RANGE_START:-50000}
      LIVEKIT_RTC_UDP_RANGE_END: ${LIVEKIT_RTC_UDP_RANGE_END:-50100}
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_HOST_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_UDP_RANGE_START:-50000}-${LIVEKIT_RTC_UDP_RANGE_END:-50100}:${LIVEKIT_RTC_UDP_RANGE_START:-50000}-${LIVEKIT_RTC_UDP_RANGE_END:-50100}/udp"
    volumes:
      - ./livekit/agentium-livekit.yaml:/etc/livekit/agentium-livekit.yaml:ro

  agentium-livekit-redis:
    image: redis:7.4-alpine
    container_name: agentium-livekit-redis
    restart: unless-stopped
    profiles: ["realtime-scale"]
    networks:
      - agentium-net
    volumes:
      - agentium_livekit_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-livekit-agent:
    image: agentium-livekit-agent:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-livekit-agent
    container_name: agentium-livekit-agent
    restart: unless-stopped
    profiles: ["realtime"]
    networks:
      - agentium-net
    environment:
      LIVEKIT_AGENT_HOST: 0.0.0.0
      LIVEKIT_AGENT_PORT: 8090
      LIVEKIT_AGENT_CONNECT_ATTEMPTS: ${LIVEKIT_AGENT_CONNECT_ATTEMPTS:-6}
      LIVEKIT_AGENT_CONNECT_RETRY_MS: ${LIVEKIT_AGENT_CONNECT_RETRY_MS:-500}
      LIVEKIT_AGENT_CONNECT_MAX_RETRY_MS: ${LIVEKIT_AGENT_CONNECT_MAX_RETRY_MS:-3000}
      # Realtime STT (gpt-realtime-whisper): the sidecar streams the published mic
      # PCM track to OpenAI directly, so it needs the key. Without it the sidecar
      # falls back to batch STT. Interpolated from the compose --env-file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional realtime STT lifecycle logging to docker logs. Keep disabled
      # by default; enable temporarily with LIVEKIT_AGENT_DEBUG_RTSTT=1.
      LIVEKIT_AGENT_DEBUG_RTSTT: ${LIVEKIT_AGENT_DEBUG_RTSTT:-0}
    depends_on:
      - agentium-livekit
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-migrate:
    image: agentium-backend:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-backend
      args:
        AGENTIUM_IMAGE_REVISION: ${AGENTIUM_IMAGE_REVISION:-unknown}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTHON_BASE_IMAGE: ${AGENTIUM_PYTHON_BASE_IMAGE:-python:3.12-slim}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    profiles: ["tools"]
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
    volumes:
      # Alembic is a PostgreSQL-only control plane. Keeping every application
      # store read-only prevents a migration import/side effect from mutating
      # tenant data outside the database backup boundary.
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store:ro
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit:ro
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db:ro
    command: ["alembic", "upgrade", "head"]

  agentium-backend:
    image: agentium-backend:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-backend
      args:
        AGENTIUM_IMAGE_REVISION: ${AGENTIUM_IMAGE_REVISION:-unknown}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTHON_BASE_IMAGE: ${AGENTIUM_PYTHON_BASE_IMAGE:-python:3.12-slim}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    container_name: agentium-backend
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_BACKEND_HOST_PORT:-8001}:8000"
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
      CELERY_RECIPE_QUEUE: recipes
      AGENTIUM_BACKEND_WORKERS: ${AGENTIUM_BACKEND_WORKERS:-3}
      AGENTIUM_BACKEND_TIMEOUT_KEEP_ALIVE: ${AGENTIUM_BACKEND_TIMEOUT_KEEP_ALIVE:-5}
      STARTUP_RECONCILIATION: ${AGENTIUM_STARTUP_RECONCILIATION:-enabled}
      LIVEKIT_AGENT_DISPATCH_URL: ${LIVEKIT_AGENT_DISPATCH_URL:-http://agentium-livekit-agent:8090/dispatch}
      LIVEKIT_VOICE_GATEWAY_WS_URL: ${LIVEKIT_VOICE_GATEWAY_WS_URL:-ws://agentium-backend:8000/api/v1/voice/sessions}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import http.client; c=http.client.HTTPConnection(\"127.0.0.1\",8000,timeout=5); c.request(\"GET\",\"/health/live\"); raise SystemExit(0 if c.getresponse().status == 200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-worker-cpu:
    image: agentium-worker:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-worker
      args:
        AGENTIUM_IMAGE_REVISION: ${AGENTIUM_IMAGE_REVISION:-unknown}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTHON_BASE_IMAGE: ${AGENTIUM_PYTHON_BASE_IMAGE:-python:3.12-slim}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    container_name: agentium-worker-cpu
    restart: unless-stopped
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
      CELERY_RECIPE_QUEUE: recipes
      CELERY_QUEUES: ${AGENTIUM_CELERY_QUEUES:-cpu}
      CELERY_LOGLEVEL: ${AGENTIUM_CELERY_LOGLEVEL:-info}
      CELERY_CONCURRENCY: ${AGENTIUM_CELERY_CONCURRENCY:-2}
      # Single cpu worker owns the embedded beat (scheduler_tick, macro refresh).
      CELERY_BEAT: ${AGENTIUM_CELERY_BEAT:-1}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit:ro
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db
      # Python recipe venv store + shared pip cache. Only the Celery worker
      # builds/executes inside it; the backend never mounts it.
      - ${AGENTIUM_RECIPE_ENVS_PATH:-/home/ubuntu/agentium-data/recipe_envs}:/data/recipe_envs
    depends_on:
      agentium-rabbitmq:
        condition: service_healthy

  # An independent pool prevents waiting Flow tasks from starving their recipes.
  agentium-worker-recipes:
    extends:
      service: agentium-worker-cpu
    container_name: agentium-worker-recipes
    environment:
      CELERY_QUEUES: recipes
      CELERY_CONCURRENCY: ${AGENTIUM_RECIPE_CONCURRENCY:-2}
      CELERY_BEAT: "0"

  # The forecasting runtime (skforecast), in its own image so neither the API
  # nor the general worker carries numba and statsmodels. Opt-in: a deployment
  # names the profile, and until its worker beats, the catalog greys the
  # forecasting family out instead of queueing fits nobody consumes.
  agentium-worker-ml-ts:
    image: agentium-ml-ts:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-ml-ts
      args:
        AGENTIUM_IMAGE_REVISION: ${AGENTIUM_IMAGE_REVISION:-unknown}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PYTHON_BASE_IMAGE: ${AGENTIUM_PYTHON_BASE_IMAGE:-python:3.12-slim}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    container_name: agentium-worker-ml-ts
    restart: unless-stopped
    profiles: ["ml-ts"]
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
      ML_RUNTIME: ml-ts
      CELERY_APP: app.workers.celery_ml:celery_ml
      CELERY_QUEUES: ml_ts
      CELERY_LOGLEVEL: ${AGENTIUM_CELERY_LOGLEVEL:-info}
      # One fit at a time: a backtest already uses the cores it is given, and
      # the memory ceiling below is for one harness, not several.
      CELERY_CONCURRENCY: ${AGENTIUM_ML_TS_CONCURRENCY:-1}
      CELERY_BEAT: "0"
    mem_limit: ${AGENTIUM_ML_TS_MEM_LIMIT:-8g}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
    depends_on:
      agentium-rabbitmq:
        condition: service_healthy

  # Forecasts on demand: the API waits for this worker's answer, so it runs a
  # threads pool whose threads share one cache of loaded models.
  agentium-worker-ml-ts-serve:
    extends:
      service: agentium-worker-ml-ts
    container_name: agentium-worker-ml-ts-serve
    profiles: ["ml-ts"]
    environment:
      CELERY_QUEUES: ml_ts_rpc
      CELERY_POOL: threads
      CELERY_CONCURRENCY: ${AGENTIUM_ML_TS_SERVE_CONCURRENCY:-4}
    mem_limit: ${AGENTIUM_ML_TS_SERVE_MEM_LIMIT:-3g}

  # Optional local foundation models; no weights are baked into this image.
  # Training and interactive requests use independent pools and heartbeats.
  agentium-worker-ml-deep:
    image: agentium-ml-deep:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-ml-deep
      args:
        AGENTIUM_IMAGE_REVISION: ${AGENTIUM_IMAGE_REVISION:-unknown}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        PYTHON_BASE_IMAGE: ${AGENTIUM_PYTHON_BASE_IMAGE:-python:3.12-slim}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    container_name: agentium-worker-ml-deep
    restart: unless-stopped
    profiles: ["ml-deep"]
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
      ML_RUNTIME: ml-deep
      ML_DEEP_MODELS_DIR: /data/models
      CELERY_APP: app.workers.celery_ml:celery_ml
      CELERY_QUEUES: ml_deep
      CELERY_LOGLEVEL: ${AGENTIUM_CELERY_LOGLEVEL:-info}
      CELERY_CONCURRENCY: ${AGENTIUM_ML_DEEP_CONCURRENCY:-1}
      CELERY_BEAT: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    mem_limit: ${AGENTIUM_ML_DEEP_MEM_LIMIT:-8g}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_ML_DEEP_MODELS_PATH:-/home/ubuntu/agentium-data/models}:/data/models:ro
    depends_on:
      agentium-rabbitmq:
        condition: service_healthy

  agentium-worker-ml-deep-serve:
    extends:
      service: agentium-worker-ml-deep
    container_name: agentium-worker-ml-deep-serve
    profiles: ["ml-deep"]
    environment:
      CELERY_QUEUES: ml_deep_rpc
      CELERY_POOL: threads
      CELERY_CONCURRENCY: ${AGENTIUM_ML_DEEP_SERVE_CONCURRENCY:-1}
    mem_limit: ${AGENTIUM_ML_DEEP_SERVE_MEM_LIMIT:-4g}

  agentium-beat:
    image: agentium-worker:${AGENTIUM_IMAGE_TAG:-local}
    container_name: agentium-beat
    restart: unless-stopped
    # Never started by a bare `up`: local/dev keeps the worker's embedded beat
    # (CELERY_BEAT default 1 above). Deployments that pin the worker to
    # AGENTIUM_CELERY_BEAT=0 name this service explicitly, which activates the
    # profile — exactly one beat per environment, never two.
    profiles: ["beat"]
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
    depends_on:
      agentium-rabbitmq:
        condition: service_healthy
    command:
      [
        "python", "-m", "celery",
        "-A", "app.workers.celery_app:celery_app",
        "beat", "--loglevel", "info",
        "--schedule", "/tmp/celerybeat-schedule",
      ]

  agentium-p4-maintenance:
    image: agentium-worker:${AGENTIUM_IMAGE_TAG:-local}
    container_name: agentium-p4-maintenance
    restart: unless-stopped
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
      CELERY_RECIPE_QUEUE: recipes
      CELERY_QUEUES: ${AGENTIUM_CELERY_QUEUES:-cpu}
      CELERY_LOGLEVEL: ${AGENTIUM_CELERY_LOGLEVEL:-info}
      CELERY_CONCURRENCY: ${AGENTIUM_CELERY_CONCURRENCY:-2}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit:ro
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db
    depends_on:
      agentium-rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.workers.p4_maintenance"]

  agentium-sftp:
    image: agentium-backend:${AGENTIUM_IMAGE_TAG:-local}
    container_name: agentium-sftp
    restart: unless-stopped
    profiles: ["sftp"]
    networks:
      - agentium-net
    ports:
      - "${AGENTIUM_SFTP_BIND_HOST:-127.0.0.1}:${AGENTIUM_SFTP_HOST_PORT:-2223}:2222"
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_DISABLE_DOTENV: "1"
      SECURE_DEPOSIT_SFTP_HOST: 0.0.0.0
      SECURE_DEPOSIT_SFTP_PORT: 2222
    volumes:
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit
    command: ["python", "-m", "app.cli.secure_deposit_sftp"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"127.0.0.1\",2222),5); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentium-minio
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${AGENTIUM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - agentium_minio:/data
    environment:
      MINIO_ROOT_USER: ${AGENTIUM_MINIO_ROOT_USER:-agentium}
      MINIO_ROOT_PASSWORD: ${AGENTIUM_MINIO_ROOT_PASSWORD:-change-me-minio-password}
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["tools"]
    networks:
      - agentium-net
    depends_on:
      agentium-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AGENTIUM_MINIO_ROOT_USER:-agentium}
      MINIO_ROOT_PASSWORD: ${AGENTIUM_MINIO_ROOT_PASSWORD:-change-me-minio-password}
      MINIO_BUCKET: ${AGENTIUM_MINIO_BUCKET:-agentium-artifacts}
      MINIO_APP_ACCESS_KEY: ${OBJECT_STORE_S3_ACCESS_KEY:-agentium-app}
      MINIO_APP_SECRET_KEY: ${OBJECT_STORE_S3_SECRET_KEY:-change-me-agentium-app-password}
      MINIO_RELEASE_A_PROBE_KEY: ${AGENTIUM_RELEASE_A_MINIO_PROBE_KEY:-.agentium-release-a-permission-probe}
      MINIO_APP_POLICY: ${AGENTIUM_RELEASE_A_MINIO_POLICY_NAME:-agentium-release-a-app-policy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077

        fail() {
          printf 'MinIO bootstrap contract failed\n' >&2
          exit 1
        }

        read_minio_user_contract() {
          mc admin user info agentium "$$MINIO_APP_ACCESS_KEY" --json > /tmp/agentium-app-user.json
          compact="$$(tr -d '[:space:]' < /tmp/agentium-app-user.json)"
          printf '%s' "$$compact" | grep -Fq '"status":"success"' || fail
          printf '%s' "$$compact" | grep -Fq '"accessKey":"'"$$MINIO_APP_ACCESS_KEY"'"' || fail
          printf '%s' "$$compact" | grep -Fq '"userStatus":"enabled"' || fail
          case "$$compact" in *'"memberOf":[]'*) ;; *'"memberOf":'*) fail ;; esac
          actual_policy="$$(printf '%s' "$$compact" | sed -n 's/.*"policyName":"\([^"]*\)".*/\1/p')"
          printf '%s\n' "$$actual_policy"
        }

        assert_minio_policy_contract() {
          rm -f /tmp/agentium-app-policy.actual.json
          mc admin policy info agentium "$$MINIO_APP_POLICY" --policy-file /tmp/agentium-app-policy.actual.json >/dev/null
          expected_policy="$$(tr -d '[:space:]' < /tmp/agentium-app-policy.json)"
          actual_policy="$$(tr -d '[:space:]' < /tmp/agentium-app-policy.actual.json)"
          [ "$$actual_policy" = "$$expected_policy" ] || fail
        }

        case "$$MINIO_APP_ACCESS_KEY" in ''|*[!A-Za-z0-9_.-]*) fail ;; esac
        case "$$MINIO_APP_POLICY" in ''|*[!A-Za-z0-9_.-]*) fail ;; esac
        case "$$MINIO_BUCKET" in ''|*[!a-z0-9.-]*) fail ;; esac
        [ "$${#MINIO_BUCKET}" -ge 3 ] && [ "$${#MINIO_BUCKET}" -le 63 ] || fail
        case "$$MINIO_RELEASE_A_PROBE_KEY" in .agentium-release-a-*) ;; *) fail ;; esac
        case "$$MINIO_RELEASE_A_PROBE_KEY" in *[!A-Za-z0-9._-]*) fail ;; esac
        mc alias set agentium http://agentium-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 || fail
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/*"]}]}' > /tmp/agentium-app-policy.json

        user_existed=false
        user_policy=''
        if mc admin user info agentium "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1; then
          user_existed=true
          user_policy="$$(read_minio_user_contract)"
          [ -z "$$user_policy" ] || [ "$$user_policy" = "$$MINIO_APP_POLICY" ] || fail
          mc alias set agentium-app http://agentium-minio:9000 "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null 2>&1 || fail
        fi

        policy_existed=false
        if mc admin policy info agentium "$$MINIO_APP_POLICY" --policy-file /tmp/agentium-app-policy.actual.json >/dev/null 2>&1; then
          policy_existed=true
          expected_policy="$$(tr -d '[:space:]' < /tmp/agentium-app-policy.json)"
          actual_policy="$$(tr -d '[:space:]' < /tmp/agentium-app-policy.actual.json)"
          [ "$$actual_policy" = "$$expected_policy" ] || fail
        else
          rm -f /tmp/agentium-app-policy.actual.json
        fi

        case "$$user_existed:$$user_policy:$$policy_existed" in
          false::false|true::false|true::true|true:"$$MINIO_APP_POLICY":true) ;;
          *) fail ;;
        esac
        mc mb --ignore-existing "agentium/$$MINIO_BUCKET"
        mc version enable "agentium/$$MINIO_BUCKET"
        case "$$user_existed:$$user_policy:$$policy_existed" in
          false::false)
            mc admin user add agentium "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null 2>&1 || fail
            [ -z "$$(read_minio_user_contract)" ] || fail
            mc alias set agentium-app http://agentium-minio:9000 "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY" >/dev/null 2>&1 || fail
            mc admin policy create agentium "$$MINIO_APP_POLICY" /tmp/agentium-app-policy.json >/dev/null
            ;;
          true::false)
            mc admin policy create agentium "$$MINIO_APP_POLICY" /tmp/agentium-app-policy.json >/dev/null
            ;;
          true::true|true:"$$MINIO_APP_POLICY":true)
            ;;
          *)
            fail
            ;;
        esac

        assert_minio_policy_contract
        if [ "$$user_policy" != "$$MINIO_APP_POLICY" ]; then
          mc admin policy attach agentium "$$MINIO_APP_POLICY" --user "$$MINIO_APP_ACCESS_KEY" >/dev/null
        fi
        [ "$$(read_minio_user_contract)" = "$$MINIO_APP_POLICY" ] || fail
        test "$$(mc version info --json "agentium/$$MINIO_BUCKET" | sed -n 's/.*"status":"\([^"]*\)".*/\1/p')" = Enabled
        test -z "$$(mc ls --versions "agentium/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY")"
        printf 'root-control' | mc pipe "agentium/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY"
        test "$$(mc cat "agentium-app/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY")" = root-control
        printf 'application-control' | mc pipe "agentium-app/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY"
        test "$$(mc cat "agentium-app/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY")" = application-control
        mc ls "agentium-app/$$MINIO_BUCKET" >/dev/null
        ! mc rm "agentium-app/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY" >/tmp/delete-denied 2>&1
        grep -Eqi 'AccessDenied|access denied' /tmp/delete-denied
        ! mc version suspend "agentium-app/$$MINIO_BUCKET" >/tmp/config-denied 2>&1
        grep -Eqi 'AccessDenied|access denied' /tmp/config-denied
        mc rm --force --versions "agentium/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY"
        ! mc stat "agentium/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY" >/dev/null 2>&1
        test -z "$$(mc ls --versions "agentium/$$MINIO_BUCKET/$$MINIO_RELEASE_A_PROBE_KEY")"
        rm -f /tmp/agentium-app-user.json /tmp/agentium-app-policy.json /tmp/agentium-app-policy.actual.json
        rm -f /tmp/delete-denied /tmp/config-denied

  agentium-pg:
    image: postgres:17
    container_name: agentium-pg
    profiles: ["infra"]
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentium_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${AGENTIUM_POSTGRES_DB:-agentium}
      POSTGRES_USER: ${AGENTIUM_POSTGRES_USER:-agentium}
      POSTGRES_PASSWORD: ${AGENTIUM_POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-kc:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: agentium-kc
    profiles: ["infra"]
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_KEYCLOAK_PORT:-8080}:8080"
    env_file:
      - ${AGENTIUM_KEYCLOAK_ENV_FILE:-./env/keycloak.agentium.env.example}
    volumes:
      - ../backend/keycloak/themes/agentium:/opt/keycloak/themes/agentium:ro
      - ../backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    command: ["start-dev"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /kc/realms/papai-org HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  agentium-qdrant:
    image: qdrant/qdrant:v1.12.5-unprivileged
    container_name: qdrant
    profiles: ["infra"]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      agentium-net:
        aliases:
          - agentium-qdrant
          - qdrant
    ports:
      - "127.0.0.1:${AGENTIUM_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${AGENTIUM_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      # Qdrant defaults snapshots outside /qdrant/storage. Bind that path
      # explicitly so production snapshots never consume the VM root disk.
      - ${AGENTIUM_QDRANT_SNAPSHOT_PATH:-/srv/agentium-data/qdrant-snapshots}:/qdrant/snapshots
    env_file:
      - ${AGENTIUM_QDRANT_ENV_FILE:-./env/qdrant.agentium.env.example}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; [[ \"$$line\" == *\"200\"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  agentium-net:
    external: true
    name: ${AGENTIUM_DOCKER_NETWORK:-agentium-net}

volumes:
  agentium_rabbitmq:
    name: agentium_rabbitmq
  agentium_pgdata:
    external: true
    name: ${AGENTIUM_POSTGRES_VOLUME:-agentium_pgdata}
  qdrant_data:
    external: true
    # Production fails closed onto the pre-created bind-backed volume. Local
    # root-disk storage is available only through compose.agentium.local-storage.yml.
    name: ${AGENTIUM_QDRANT_VOLUME:-agentium_qdrant_block}
  agentium_minio:
    # Never create a fresh MinIO volume on the production root filesystem.
    # The explicit local/dev overlay is the only supported local-volume path.
    external: ${AGENTIUM_MINIO_VOLUME_EXTERNAL:-true}
    name: ${AGENTIUM_MINIO_VOLUME:-agentium_minio_block}
  agentium_livekit_redis:
    name: agentium_livekit_redis
