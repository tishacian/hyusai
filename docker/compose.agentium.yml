name: agentium

services:
  agentium-frontend:
    image: agentium-frontend:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-frontend
    container_name: agentium-frontend
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_FRONTEND_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-rabbitmq:
    image: rabbitmq:4.1-management
    container_name: agentium-rabbitmq
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${AGENTIUM_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - agentium_rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${AGENTIUM_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${AGENTIUM_RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-livekit:
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-v1.12.0}
    container_name: agentium-livekit
    restart: unless-stopped
    profiles: ["realtime"]
    networks:
      - agentium-net
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        yaml_quote() {
          printf "%s" "$$1" | sed "s/'/''/g"
        }
        redis_block=""
        if [ -n "$${LIVEKIT_REDIS_ADDRESS:-}" ]; then
          redis_block="$$(printf "redis:\n  address: '%s'" "$$(yaml_quote "$$LIVEKIT_REDIS_ADDRESS")")"
          if [ -n "$${LIVEKIT_REDIS_USERNAME:-}" ]; then
            redis_block="$$(printf "%s\n  username: '%s'" "$$redis_block" "$$(yaml_quote "$$LIVEKIT_REDIS_USERNAME")")"
          fi
          if [ -n "$${LIVEKIT_REDIS_PASSWORD:-}" ]; then
            redis_block="$$(printf "%s\n  password: '%s'" "$$redis_block" "$$(yaml_quote "$$LIVEKIT_REDIS_PASSWORD")")"
          fi
          if [ -n "$${LIVEKIT_REDIS_DB:-}" ]; then
            redis_block="$$(printf "%s\n  db: %s" "$$redis_block" "$$LIVEKIT_REDIS_DB")"
          fi
        fi
        if [ -n "$${LIVEKIT_KEYS:-}" ]; then
          LIVEKIT_KEYS="$$(printf "%s" "$$LIVEKIT_KEYS" | sed -E 's/:([^[:space:]])/: \1/g')"
        fi
        if ! printf "%s" "$${LIVEKIT_KEYS:-}" | grep -Eq '^[^[:space:]:]+: [^[:space:]].*'; then
          LIVEKIT_KEYS="$${LIVEKIT_API_KEY:-devkey}: $${LIVEKIT_API_SECRET:-change-me-livekit-secret-at-least-32-chars}"
        fi
        export LIVEKIT_KEYS
        test -n "$${LIVEKIT_WEBHOOK_API_KEY:-$${LIVEKIT_API_KEY:-devkey}}"
        awk \
          -v webhook_key="$${LIVEKIT_WEBHOOK_API_KEY:-$${LIVEKIT_API_KEY:-devkey}}" \
          -v redis_block="$$redis_block" \
          -v rtc_tcp_port="$${LIVEKIT_RTC_TCP_PORT:-7881}" \
          -v rtc_udp_start="$${LIVEKIT_RTC_UDP_RANGE_START:-50000}" \
          -v rtc_udp_end="$${LIVEKIT_RTC_UDP_RANGE_END:-50100}" \
          '{ gsub("__LIVEKIT_WEBHOOK_API_KEY__", webhook_key); gsub("__LIVEKIT_REDIS_BLOCK__", redis_block); gsub("__LIVEKIT_RTC_TCP_PORT__", rtc_tcp_port); gsub("__LIVEKIT_RTC_UDP_RANGE_START__", rtc_udp_start); gsub("__LIVEKIT_RTC_UDP_RANGE_END__", rtc_udp_end); print }' \
          /etc/livekit/agentium-livekit.yaml > /tmp/agentium-livekit.yaml
        exec /livekit-server --config /tmp/agentium-livekit.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change-me-livekit-secret-at-least-32-chars}
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:-}
      LIVEKIT_WEBHOOK_API_KEY: ${LIVEKIT_WEBHOOK_API_KEY:-${LIVEKIT_API_KEY:-devkey}}
      LIVEKIT_REDIS_ADDRESS: ${LIVEKIT_REDIS_ADDRESS:-}
      LIVEKIT_REDIS_USERNAME: ${LIVEKIT_REDIS_USERNAME:-}
      LIVEKIT_REDIS_PASSWORD: ${LIVEKIT_REDIS_PASSWORD:-}
      LIVEKIT_REDIS_DB: ${LIVEKIT_REDIS_DB:-}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_RTC_TCP_PORT:-7881}
      LIVEKIT_RTC_UDP_RANGE_START: ${LIVEKIT_RTC_UDP_RANGE_START:-50000}
      LIVEKIT_RTC_UDP_RANGE_END: ${LIVEKIT_RTC_UDP_RANGE_END:-50100}
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_HOST_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_BIND_HOST:-0.0.0.0}:${LIVEKIT_RTC_UDP_RANGE_START:-50000}-${LIVEKIT_RTC_UDP_RANGE_END:-50100}:${LIVEKIT_RTC_UDP_RANGE_START:-50000}-${LIVEKIT_RTC_UDP_RANGE_END:-50100}/udp"
    volumes:
      - ./livekit/agentium-livekit.yaml:/etc/livekit/agentium-livekit.yaml:ro

  agentium-livekit-redis:
    image: redis:7.4-alpine
    container_name: agentium-livekit-redis
    restart: unless-stopped
    profiles: ["realtime-scale"]
    networks:
      - agentium-net
    volumes:
      - agentium_livekit_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-livekit-agent:
    image: agentium-livekit-agent:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-livekit-agent
    container_name: agentium-livekit-agent
    restart: unless-stopped
    profiles: ["realtime"]
    networks:
      - agentium-net
    environment:
      LIVEKIT_AGENT_HOST: 0.0.0.0
      LIVEKIT_AGENT_PORT: 8090
      LIVEKIT_AGENT_CONNECT_ATTEMPTS: ${LIVEKIT_AGENT_CONNECT_ATTEMPTS:-6}
      LIVEKIT_AGENT_CONNECT_RETRY_MS: ${LIVEKIT_AGENT_CONNECT_RETRY_MS:-500}
      LIVEKIT_AGENT_CONNECT_MAX_RETRY_MS: ${LIVEKIT_AGENT_CONNECT_MAX_RETRY_MS:-3000}
      # Realtime STT (gpt-realtime-whisper): the sidecar streams the published mic
      # PCM track to OpenAI directly, so it needs the key. Without it the sidecar
      # falls back to batch STT. Interpolated from the compose --env-file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - agentium-livekit
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-migrate:
    image: agentium-backend:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    profiles: ["tools"]
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db
    command: ["alembic", "upgrade", "head"]

  agentium-backend:
    image: agentium-backend:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    container_name: agentium-backend
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_BACKEND_HOST_PORT:-8001}:8000"
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      AGENTIUM_BACKEND_WORKERS: ${AGENTIUM_BACKEND_WORKERS:-3}
      AGENTIUM_BACKEND_TIMEOUT_KEEP_ALIVE: ${AGENTIUM_BACKEND_TIMEOUT_KEEP_ALIVE:-5}
      LIVEKIT_AGENT_DISPATCH_URL: ${LIVEKIT_AGENT_DISPATCH_URL:-http://agentium-livekit-agent:8090/dispatch}
      LIVEKIT_VOICE_GATEWAY_WS_URL: ${LIVEKIT_VOICE_GATEWAY_WS_URL:-ws://agentium-backend:8000/api/v1/voice/sessions}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import http.client; c=http.client.HTTPConnection(\"127.0.0.1\",8000,timeout=5); c.request(\"GET\",\"/health/live\"); raise SystemExit(0 if c.getresponse().status == 200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-worker-cpu:
    image: agentium-worker:${AGENTIUM_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.agentium-worker
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        USER_UID: ${AGENTIUM_RUNTIME_UID:-1000}
        USER_GID: ${AGENTIUM_RUNTIME_GID:-1000}
    container_name: agentium-worker-cpu
    restart: unless-stopped
    networks:
      - agentium-net
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      CELERY_QUEUES: ${AGENTIUM_CELERY_QUEUES:-cpu}
      CELERY_LOGLEVEL: ${AGENTIUM_CELERY_LOGLEVEL:-info}
      CELERY_CONCURRENCY: ${AGENTIUM_CELERY_CONCURRENCY:-2}
    volumes:
      - ${AGENTIUM_OBJECT_STORE_PATH:-/home/ubuntu/agentium-data/object_store}:/data/object_store
      - ${AGENTIUM_FAISS_PATH:-/home/ubuntu/omnirag/backend/faiss_db}:/data/faiss_db
    depends_on:
      agentium-rabbitmq:
        condition: service_healthy

  agentium-sftp:
    image: agentium-backend:${AGENTIUM_IMAGE_TAG:-local}
    container_name: agentium-sftp
    restart: unless-stopped
    profiles: ["sftp"]
    networks:
      - agentium-net
    ports:
      - "${AGENTIUM_SFTP_BIND_HOST:-127.0.0.1}:${AGENTIUM_SFTP_HOST_PORT:-2223}:2222"
    env_file:
      - ${AGENTIUM_ENV_FILE:-./env/agentium.env.example}
    environment:
      SECURE_DEPOSIT_SFTP_HOST: 0.0.0.0
      SECURE_DEPOSIT_SFTP_PORT: 2222
    volumes:
      - ${AGENTIUM_SECURE_DEPOSIT_PATH:-/home/ubuntu/omnirag/backend/data/secure_deposit}:/data/secure_deposit
    command: ["python", "-m", "app.cli.secure_deposit_sftp"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"127.0.0.1\",2222),5); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agentium-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: agentium-minio
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${AGENTIUM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - agentium_minio:/data
    environment:
      MINIO_ROOT_USER: ${AGENTIUM_MINIO_ROOT_USER:-agentium}
      MINIO_ROOT_PASSWORD: ${AGENTIUM_MINIO_ROOT_PASSWORD:-change-me-minio-password}
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["tools"]
    networks:
      - agentium-net
    depends_on:
      agentium-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AGENTIUM_MINIO_ROOT_USER:-agentium}
      MINIO_ROOT_PASSWORD: ${AGENTIUM_MINIO_ROOT_PASSWORD:-change-me-minio-password}
      MINIO_BUCKET: ${AGENTIUM_MINIO_BUCKET:-agentium-artifacts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set agentium http://agentium-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing "agentium/$$MINIO_BUCKET"

  agentium-pg:
    image: postgres:17
    container_name: agentium-pg
    profiles: ["infra"]
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentium_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${AGENTIUM_POSTGRES_DB:-agentium}
      POSTGRES_USER: ${AGENTIUM_POSTGRES_USER:-agentium}
      POSTGRES_PASSWORD: ${AGENTIUM_POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  agentium-kc:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: agentium-kc
    profiles: ["infra"]
    restart: unless-stopped
    networks:
      - agentium-net
    ports:
      - "127.0.0.1:${AGENTIUM_KEYCLOAK_PORT:-8080}:8080"
    env_file:
      - ${AGENTIUM_KEYCLOAK_ENV_FILE:-./env/keycloak.agentium.env.example}
    volumes:
      - ../backend/keycloak/themes/agentium:/opt/keycloak/themes/agentium:ro
      - ../backend/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    command: ["start-dev"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /kc/realms/papai-org HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  agentium-qdrant:
    image: qdrant/qdrant:v1.12.5-unprivileged
    container_name: qdrant
    profiles: ["infra"]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      agentium-net:
        aliases:
          - agentium-qdrant
          - qdrant
    ports:
      - "127.0.0.1:${AGENTIUM_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${AGENTIUM_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - ${AGENTIUM_QDRANT_ENV_FILE:-./env/qdrant.agentium.env.example}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; [[ \"$$line\" == *\"200\"* ]]'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  agentium-net:
    external: true
    name: ${AGENTIUM_DOCKER_NETWORK:-agentium-net}

volumes:
  agentium_rabbitmq:
    name: agentium_rabbitmq
  agentium_pgdata:
    external: true
    name: ${AGENTIUM_POSTGRES_VOLUME:-agentium_pgdata}
  qdrant_data:
    external: true
    name: ${AGENTIUM_QDRANT_VOLUME:-qdrant_data}
  agentium_minio:
    name: agentium_minio
  agentium_livekit_redis:
    name: agentium_livekit_redis
