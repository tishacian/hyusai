server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Defense in depth: the host ingress rejects these paths too, but the
    # frontend container must remain safe if it is probed directly. Without
    # this guard, try_files below returns index.html with 200 for dotfiles.
    # Preserve the root namespace used by certbot's ACME HTTP-01 challenge.
    location ~ ^(?!/\.well-known/acme-challenge/)(?:.*/)?\. {
        return 404;
    }

    # pdf.js (ngx-extended-pdf-viewer) ships its worker/viewer as ES modules
    # (.mjs) plus a .wasm blob, which nginx mime.types may map to
    # application/octet-stream — rejected by strict-MIME ES module loading.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
