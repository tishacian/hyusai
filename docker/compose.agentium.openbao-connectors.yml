# Added only when both connectors and OpenBao are selected. No new AppRole.
services:
  agentium-worker-connectors:
    environment: &connector-bao
      OPENBAO_ADDR: http://agentium-openbao:8200
      OPENBAO_MOUNT: agentium
    env_file:
      - ${AGENTIUM_OPENBAO_WORKER_ENV_FILE:?Set the OpenBao worker AppRole environment file}
  agentium-worker-connectors-interactive:
    environment: *connector-bao
    env_file:
      - ${AGENTIUM_OPENBAO_WORKER_ENV_FILE:?Set the OpenBao worker AppRole environment file}
