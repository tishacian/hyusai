name: papai-llm
volumes:
  db_data:
  minio_data:
  models:
  assets:
services:
  # -----------------------
  # Infrastructure services
  # -----------------------
  broker:
    image: rabbitmq:4.1-management
    container_name: broker
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  db:
    image: postgres:17
    container_name: db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - ./test_env_files/db.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    env_file:
      - ./test_env_files/minio.env
    command: server /data --console-address ":9001"
  # ------------------------
  # Init / one-shot services
  # ------------------------
  init:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.celery_cpu
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
    image: papai-llm-celery-cpu:latest
    container_name: init
    user: root
    volumes:
      - assets:/data/assets
    env_file:
      - test_env_files/papai_llm.env
    command: bash /app/docker/scripts/run_init.sh
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: "no"
  # ---------------------
  # Core backend services
  # ---------------------
  fastapi:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.fastapi
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
    container_name: fastapi
    ports:
      - "8000:8000"
    env_file:
      - test_env_files/papai_llm.env
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import http.client; exit(0 if http.client.HTTPConnection(\"fastapi\",8000).request(\"GET\",\"/healthz/ready\") or True else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  celery-cpu:
    image: papai-llm-celery-cpu:latest
    volumes:
      - models:/data/models
      - assets:/data/assets
    env_file:
      - test_env_files/papai_llm.env
    environment:
      CELERY_QUEUES: cpu
      CELERY_LOGLEVEL: debug
    depends_on:
      init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
  # celery-gpu:
  #   build:
  #     context: ..
  #     dockerfile: ./docker/Dockerfile.celery_gpu
  #     args:
  #       PIP_INDEX_URL: ${PIP_INDEX_URL}
  #   volumes:
  #     - models:/data/models
  #     - assets:/data/assets
  #   env_file:
  #     - test_env_files/papai_llm.env
  #   environment:
  #     CELERY_QUEUES: gpu
  #     CELERY_LOGLEVEL: debug
  #   depends_on:
  #     init:
  #       condition: service_completed_successfully
  #   deploy:
  #     replicas: 1
  # ----------------
  # Frontend service
  # ----------------
  frontend:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.frontend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL}
    container_name: frontend
    ports:
      - "8501:8501"
    volumes:
      - models:/data/models
    env_file:
      - test_env_files/papai_llm.env
    depends_on:
      fastapi:
        condition: service_healthy
