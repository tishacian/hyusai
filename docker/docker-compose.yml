version: "3.9"

name: papai-llm
services:
  fastapi:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.fastapi
      secrets:
        - nexus_username
        - nexus_password
    container_name: papai-llm-fastapi
    ports:
      - "8000:8000"
    env_file:
      - test_env_files/fastapi.env
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_started
  celery-cpu:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.celery_cpu
      secrets:
        - nexus_username
        - nexus_password
    env_file:
      - test_env_files/celery.env
    environment:
      CELERY_QUEUES: cpu
      CELERY_LOGLEVEL: debug
    depends_on:
      broker:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      replicas: 2
  broker:
    image: rabbitmq:4.1-management
    container_name: broker
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      retries: 5
  db:
    image: postgres:15
    container_name: db
    ports:
      - "5432:5432"
    env_file:
      - ./test_env_files/db.env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    env_file:
      - ./test_env_files/minio.env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  # # optional db monitorer
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "8080:80"
volumes:
  db_data:
  minio_data:
secrets:
  nexus_username:
    file: ./secrets/nexus_username.txt
  nexus_password:
    file: ./secrets/nexus_password.txt