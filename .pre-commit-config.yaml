repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: destroyed-symlinks
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            benchmarking/customchain.*\.py|
            src/system_prompts/en.py|
            src/system_prompts/fr.py
          )$
      - id: forbid-submodules
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
  - repo: https://github.com/syntaqx/git-hooks
    rev: "v0.0.18"
    hooks:
      - id: shellcheck
      - id: shfmt
        args:
          - -w
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args:
          - --fix
          - --select=I,F401,E402,UP006
        exclude: ^benchmarking/
      - id: ruff-format
        exclude: ^benchmarking/
  - repo: local
    hooks:
      - id: agentium-compliance
        name: Agentium product compliance contract
        entry: python3 scripts/agentium_compliance.py --check
        language: system
        pass_filenames: false
        always_run: true
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # Terraform. fmt and validate also run in CI through
  # ops/scripts/check-k8s-scaffold.sh; running them here keeps a formatting
  # diff out of the review. The provider locks are committed for darwin_arm64
  # and linux_amd64, so validate's init no longer rewrites them.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
  # Charts. Catches a template that stops rendering, before CI does.
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30
    hooks:
      - id: helmlint
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # Helm templates are Go templates that only become YAML once rendered,
        # and the LiveKit config carries envsubst placeholders. yamlfmt parses
        # neither, and failed on all sixteen of them. helmlint and
        # check-k8s-scaffold.sh cover the chart instead.
        exclude: |
          (?x)^(
            ops/helm/.*/templates/.*\.ya?ml|
            docker/livekit/agentium-livekit\.yaml
          )$
  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.9.0
    hooks:
      - id: pre-commit-update
