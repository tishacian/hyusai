repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: destroyed-symlinks
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            benchmarking/customchain.*\.py|
            src/system_prompts/en.py|
            src/system_prompts/fr.py
          )$
      - id: forbid-submodules
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
  - repo: https://github.com/syntaqx/git-hooks
    rev: "v0.0.18"
    hooks:
      - id: shellcheck
      - id: shfmt
        args:
          - -w
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args:
          - --fix
          - --select=I,F401,E402,UP006
        exclude: ^benchmarking/
      - id: ruff-format
        exclude: ^benchmarking/
  - repo: local
    hooks:
      - id: agentium-compliance
        name: Agentium product compliance contract
        entry: python3 scripts/agentium_compliance.py --check
        language: system
        pass_filenames: false
        always_run: true
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
    rev: v0.9.0
    hooks:
      - id: pre-commit-update
