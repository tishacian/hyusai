/* === tokens/cockpit-tokens.css === */
/* ============================================================================
   AGENTIUM — Cockpit Design Tokens (Hybrid A+B)
   --------------------------------------------------------------------------
   Operating System for Intelligence.
   Base: Concept A (Instrument Panel) — dense cockpit, precision, tabular nums.
   Touches: Concept B (Living Organism) — generous glows, radial ambient on hero.
   --------------------------------------------------------------------------
   Drives every cockpit-grade surface (chrome, hypervisor, steering, run, …).
   Coexists with the legacy Tailwind tokens in styles.scss; the cockpit grammar
   only uses --ck-* variables to remain isolated and easily themable.
   ============================================================================ */

:root {
  /* ---- SURFACES (deep cockpit blacks) ---- */
  --ck-bg-void:      #05070a;
  --ck-bg-base:      #07090c;
  --ck-bg-panel:     #0c1014;
  --ck-bg-panel-hi:  #11161c;
  --ck-bg-inset:     #0a0d11;
  --ck-bg-code:      #050709;

  /* ---- STROKES ---- */
  --ck-stroke-1:     rgba(255, 255, 255, 0.04);
  --ck-stroke-2:     rgba(255, 255, 255, 0.08);
  --ck-stroke-3:     rgba(255, 255, 255, 0.14);
  --ck-stroke-hot:   rgba(125, 211, 252, 0.32);

  /* ---- TEXT ---- */
  --ck-fg-1:         #f2f5f8;
  --ck-fg-2:         #c8cdd4;
  --ck-fg-3:         #8891a0;
  --ck-fg-4:         #7b8391;   /* AA: >=4.5:1 on dark panels (secondary/caption text) */
  --ck-fg-5:         #606874;   /* faint tier: >=3:1 (large/bold text, UI elements, borders) */

  /* ---- SIGNALS (semantic palette) ---- */
  --ck-signal-pos:    #34d399;
  --ck-signal-neg:    #ef5a6f;
  --ck-signal-warn:   #f5b84a;
  --ck-signal-cool:   #7dd3fc;
  --ck-signal-violet: #a78bfa;
  --ck-signal-ice:    #e0f2fe;

  /* ---- GLOWS (touches Concept B: generous halos on live surfaces) ---- */
  --ck-glow-cool:    0 0 32px rgba(125, 211, 252, 0.32);
  --ck-glow-pos:     0 0 32px rgba(52, 211, 153, 0.28);
  --ck-glow-violet:  0 0 32px rgba(167, 139, 250, 0.30);
  --ck-glow-warn:    0 0 28px rgba(245, 184, 74, 0.28);
  --ck-glow-neg:     0 0 28px rgba(239, 90, 111, 0.30);

  /* ---- SHADOWS (depth, panels, popovers) ----
     Dark cockpit: deep diffuse black. On light these get softened
     in the `[data-theme="light"]` block below so panels don't read as
     "punched out" on warm paper. Consumers MUST use var(--ck-shadow-*)
     rather than inlining `rgba(0,0,0,0.5)` so the theme travels. */
  --ck-shadow-panel:   0 20px 60px rgba(0, 0, 0, 0.50);
  --ck-shadow-popover: 0 18px 40px rgba(0, 0, 0, 0.45);
  --ck-shadow-card:    0 6px 18px rgba(0, 0, 0, 0.35);
  /* Scrim beneath overlays (panels, modals, palette). */
  --ck-scrim:          rgba(0, 0, 0, 0.45);

  /* Text color to render on top of a saturated signal background
     (ck-tag variant="solid", primary signal buttons). Dark theme →
     bright signal bg → dark text reads best. Flipped on light. */
  --ck-on-signal: #05070a;

  /* Subtle tint for faintly-accented surfaces (neutral soft tag bg,
     hover washes, empty-state wells). Dark theme uses a white wash;
     light theme swaps to a black wash below. */
  --ck-tint-faint: rgba(255, 255, 255, 0.04);
  --ck-tint-soft:  rgba(255, 255, 255, 0.06);

  /* ---- TYPE STACKS ---- */
  --ck-font-sans: "Inter Tight", "Inter", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --ck-font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* ---- RADII ---- */
  --ck-radius-sm: 4px;
  --ck-radius-md: 6px;
  --ck-radius-lg: 10px;
  --ck-radius-xl: 14px;

  /* ---- MOTION ---- */
  --ck-ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --ck-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ck-dur-fast:    120ms;
  --ck-dur-med:     240ms;
  --ck-dur-slow:    520ms;

  /* ---- LAYOUT ---- */
  --ck-rail-w:        56px;
  --ck-titlebar-h:    48px;
  --ck-commandbar-h:  28px;
}

/* ============================================================================
   Light variant — papier-chaud overrides for `[data-theme="light"]` and
   the legacy `:not(.dark)` class to remain backward compatible during the
   migration window.
   ============================================================================ */
html:not(.dark),
[data-theme="light"] {
  --ck-bg-void:     #e8e6df;
  --ck-bg-base:     #f4f2eb;
  --ck-bg-panel:    #fafaf6;
  --ck-bg-panel-hi: #ffffff;
  --ck-bg-inset:    #efede6;
  --ck-bg-code:     #1a1c20;

  --ck-stroke-1:    rgba(0, 0, 0, 0.06);
  --ck-stroke-2:    rgba(0, 0, 0, 0.10);
  --ck-stroke-3:    rgba(0, 0, 0, 0.18);
  --ck-stroke-hot:  rgba(14, 116, 144, 0.40);

  --ck-fg-1:        #0a0c10;
  --ck-fg-2:        #2a2f36;
  --ck-fg-3:        #5c6370;
  --ck-fg-4:        #656b78;   /* AA: >=4.5:1 on light panels (secondary/caption text) */
  --ck-fg-5:        #868d99;   /* faint tier: >=3:1 on panel surfaces */

  --ck-signal-pos:    #0e9f6e;
  --ck-signal-neg:    #d93a52;
  --ck-signal-warn:   #c27803;
  --ck-signal-cool:   #0e7490;
  --ck-signal-violet: #7c3aed;
  --ck-signal-ice:    #0c4a6e;

  /* Glows are noisy on light surfaces — disable them by default. */
  --ck-glow-cool:    0 0 0 transparent;
  --ck-glow-pos:     0 0 0 transparent;
  --ck-glow-violet:  0 0 0 transparent;
  --ck-glow-warn:    0 0 0 transparent;
  --ck-glow-neg:     0 0 0 transparent;

  /* Softened shadows on warm paper — a 50 % black shadow would shout;
     we drop the alpha to keep panels grounded without bruising. */
  --ck-shadow-panel:   0 18px 48px rgba(17, 24, 39, 0.14), 0 2px 6px rgba(17, 24, 39, 0.08);
  --ck-shadow-popover: 0 12px 32px rgba(17, 24, 39, 0.12), 0 2px 4px rgba(17, 24, 39, 0.06);
  --ck-shadow-card:    0 4px 12px rgba(17, 24, 39, 0.08);
  /* Scrim — stays dark-ish so the overlay reads as "modal" even on paper. */
  --ck-scrim:          rgba(17, 24, 39, 0.28);

  /* On light the signal tones are already dark-saturated (see the
     --ck-signal-* block above — #0e9f6e, #0e7490…), so white text on
     top of a solid pill is the only legible combo. */
  --ck-on-signal: #ffffff;

  /* Tints flip to a black wash so neutral-soft pills & hovers stay
     visible against the warm paper. */
  --ck-tint-faint: rgba(17, 24, 39, 0.05);
  --ck-tint-soft:  rgba(17, 24, 39, 0.08);
}

/* === tokens/mission-tokens.css === */
/* ============================================================================
   SENTINEL-CI / MISSION ROOM — Design Tokens
   --------------------------------------------------------------------------
   Centralises the `--mission-*`, `--sentinel-*` and `--agentium-*` tokens
   used by the Vice Premier Ministre cockpit. Loads AFTER cockpit-tokens so the
   --ck-* palette stays the deep foundation while these tokens layer a
   sovereign vert-ivoire / orange-stratégique chrome on top.

   Rationale:
   * Keep tokens **in one place** instead of duplicated inline `:host`
     declarations in each mission-room component (they used to drift).
   * Allow standalone components (chat drawer, signin variants, etc.) to
     reuse the sovereign palette without depending on mission-room being
     mounted as the parent.
   * Preserve backward-compat: legacy aliases (`--mission-bg`, `--mission-text`,
     `--mission-warn`, …) remain available for components already in flight.
   ============================================================================ */

:root {
  /* ---- Surfaces (sovereign cockpit black with a faint green tint) ------- */
  --mission-bg-base:    #05080c;
  --mission-bg-grid:    rgba(101, 214, 110, 0.035);
  --mission-bg:         var(--mission-bg-base);              /* legacy alias */
  --mission-surface-1:  rgba(15, 24, 28, 0.94);              /* panels      */
  --mission-surface-2:  rgba(18, 31, 28, 0.92);              /* raised      */
  --mission-surface-3:  rgba(28, 44, 38, 0.92);              /* hovered     */
  --mission-inset:      rgba(4, 8, 13, 0.84);
  --mission-rail-bg:    linear-gradient(180deg, #05080c 0%, #06100a 100%);
  --mission-panel:      linear-gradient(180deg, var(--mission-surface-1) 0%, rgba(10, 16, 19, 0.98) 100%);
  --mission-panel-hi:   var(--mission-surface-2);

  /* ---- Borders / strokes ----------------------------------------------- */
  --mission-border-subtle: rgba(156, 184, 212, 0.10);
  --mission-border:        rgba(156, 184, 212, 0.14);        /* default     */
  --mission-border-strong: rgba(101, 214, 110, 0.30);

  /* ---- Text ------------------------------------------------------------ */
  --mission-text-primary:   #f4f7fb;
  --mission-text-secondary: #c4ceda;
  --mission-text-tertiary:  #8996a8;
  --mission-text-disabled:  #596678;
  /* legacy aliases (kept so existing inline styles keep working) */
  --mission-text:        var(--mission-text-primary);
  --mission-text-soft:   var(--mission-text-secondary);
  --mission-text-muted:  var(--mission-text-tertiary);
  --mission-text-faint:  var(--mission-text-disabled);

  /* ---- SENTINEL palette (vert-ivoire institutionnel) ------------------- */
  --sentinel-accent:        #65d66e;
  --sentinel-accent-strong: #93ef74;
  --sentinel-accent-soft:   rgba(101, 214, 110, 0.095);
  --sentinel-accent-muted:  rgba(101, 214, 110, 0.38);
  /* legacy aliases */
  --mission-accent:         var(--sentinel-accent);
  --mission-accent-strong:  var(--sentinel-accent-strong);
  --mission-accent-wash:    var(--sentinel-accent-soft);
  --mission-accent-muted:   var(--sentinel-accent-muted);

  /* ---- Semantic signals + soft variants -------------------------------- */
  --mission-success:        #3fd18d;
  --mission-success-soft:   rgba(63, 209, 141, 0.10);
  --mission-warning:        #f1b45a;
  --mission-warning-soft:   rgba(241, 180, 90, 0.12);
  --mission-critical:       #f06476;
  --mission-critical-soft:  rgba(240, 100, 118, 0.12);
  --mission-info:           #7dd3fc;
  --mission-info-soft:      rgba(125, 211, 252, 0.10);
  /* legacy aliases */
  --mission-trust:          var(--mission-success);
  --mission-trust-wash:     var(--mission-success-soft);
  --mission-warn:           var(--mission-warning);
  --mission-warn-wash:      var(--mission-warning-soft);
  --mission-danger:         var(--mission-critical);
  --mission-danger-wash:    var(--mission-critical-soft);

  /* ---- SENTINEL orange-stratégique (alerts, "maintenant" markers) ------ */
  --mission-orange:         #f28c38;
  --mission-orange-soft:    rgba(242, 140, 56, 0.12);
  --mission-orange-wash:    var(--mission-orange-soft);      /* legacy      */
  --mission-gold:           #e3c681;

  /* ---- AGENTIUM AYA (assistant signature) ------------------------------ */
  --agentium-aya:           #f28c38;                         /* same hue as
                                                                 orange so
                                                                 AYA reads
                                                                 as state actor
                                                                 + assistant. */
  --agentium-aya-soft:      rgba(242, 140, 56, 0.10);
  --agentium-aya-halo:      0 0 0 4px rgba(242, 140, 56, 0.18);

  /* ---- Typography ------------------------------------------------------ */
  /* Reuse the cockpit stacks so the cockpit chrome and the mission room
     keep the same letterforms — no extra font request, no FOUT. */
  --mission-font-display: var(--ck-font-sans);
  --mission-font-body:    var(--ck-font-sans);
  --mission-font-mono:    var(--ck-font-mono);

  /* Mission type scale (12px base, generous LH). Kept independent of the
     legacy `--text-*` tokens so consumers can pick `--mission-text-md`
     without trampling Tailwind utilities. */
  --mission-text-xs:   11px;
  --mission-text-sm:   13px;
  --mission-text-base: 14px;
  --mission-text-md:   16px;
  --mission-text-lg:   20px;
  --mission-text-xl:   28px;
  --mission-text-2xl:  36px;
  --mission-lh-body:   1.5;
  --mission-lh-tight:  1.2;
  --mission-tracking-tight: -0.01em;
  --mission-tracking-micro: 0.14em;

  /* ---- Spacing scale (4px base) ---------------------------------------- */
  --mission-space-1:  4px;
  --mission-space-2:  8px;
  --mission-space-3:  12px;
  --mission-space-4:  16px;
  --mission-space-5:  20px;
  --mission-space-6:  24px;
  --mission-space-8:  32px;
  --mission-space-10: 40px;
  --mission-space-12: 48px;

  /* ---- Radii ----------------------------------------------------------- */
  --mission-radius-sm: 4px;
  --mission-radius-md: 8px;
  --mission-radius-lg: 12px;
  --mission-radius-xl: 16px;
  /* legacy aliases — many components still spell --mission-radius */
  --mission-radius:    var(--mission-radius-md);

  /* ---- Shadows --------------------------------------------------------- */
  --mission-shadow-soft:     0 4px 14px rgba(0, 0, 0, 0.22);
  --mission-shadow-elevated: 0 12px 30px rgba(0, 0, 0, 0.32);
  --mission-shadow-floating: 0 24px 60px rgba(0, 0, 0, 0.46);
  --mission-shadow-card:     var(--mission-shadow-soft);      /* legacy     */

  /* ---- Motion ---------------------------------------------------------- */
  --mission-ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
  --mission-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --mission-dur-fast:    120ms;
  --mission-dur-base:    200ms;
  --mission-dur-slow:    420ms;
}

/* ============================================================================
   Reusable mission-room primitives
   --------------------------------------------------------------------------
   These classes are opt-in. Components that already author their own SCSS
   keep working unchanged; new markup can lean on these helpers to stay
   consistent without re-declaring borders/paddings every time.
   ============================================================================ */

/* Focus ring used across the cockpit (WCAG-friendly, sovereign tone). */
.mission-focus-ring:focus-visible,
.mission-focus-ring:focus {
  outline: 2px solid var(--sentinel-accent);
  outline-offset: 2px;
}

/* Clickable surface — neutral idle, accent-tinted hover, ring on focus. */
.mission-surface-button {
  cursor: pointer;
  background: var(--mission-surface-2);
  border: 1px solid var(--mission-border);
  border-radius: var(--mission-radius-md);
  color: inherit;
  font: inherit;
  text-align: left;
  appearance: none;
  transition:
    border-color var(--mission-dur-fast) var(--mission-ease-out),
    background var(--mission-dur-fast) var(--mission-ease-out),
    box-shadow var(--mission-dur-fast) var(--mission-ease-out);
}
.mission-surface-button:hover {
  border-color: var(--sentinel-accent-muted);
  background: var(--mission-surface-3);
}
.mission-surface-button:focus-visible {
  outline: 2px solid var(--sentinel-accent);
  outline-offset: 2px;
}

.mission-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--mission-space-3);
  min-width: 0;
}
.mission-panel-head-copy {
  display: grid;
  gap: var(--mission-space-1);
  min-width: 0;
}
.mission-panel-kicker {
  color: var(--mission-text-tertiary);
  font-family: var(--mission-font-mono);
  font-size: 10px;
  letter-spacing: var(--mission-tracking-micro);
  text-transform: uppercase;
}
.mission-panel-title {
  margin: 0;
  color: var(--mission-text-primary);
  font-size: var(--mission-text-md);
  font-weight: 650;
  letter-spacing: var(--mission-tracking-tight);
  line-height: var(--mission-lh-tight);
}
.mission-panel-subtitle {
  margin: 0;
  color: var(--mission-text-secondary);
  font-size: var(--mission-text-sm);
  line-height: var(--mission-lh-body);
}

.mission-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  width: fit-content;
  min-height: 22px;
  padding: 3px 9px;
  border: 1px solid var(--mission-border);
  border-radius: 999px;
  background: rgba(4, 8, 13, 0.48);
  color: var(--mission-text-secondary);
  font-family: var(--mission-font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
}
.mission-status-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.86;
}
.mission-status-badge.is-live {
  border-color: rgba(63, 209, 141, 0.45);
  background: var(--mission-success-soft);
  color: var(--mission-success);
}
.mission-status-badge.is-baseline {
  border-color: rgba(241, 180, 90, 0.38);
  background: var(--mission-warning-soft);
  color: var(--mission-warning);
}
.mission-status-badge.is-advisory {
  border-color: rgba(125, 211, 252, 0.34);
  background: var(--mission-info-soft);
  color: var(--mission-info);
}
.mission-status-badge.is-watch {
  border-color: rgba(242, 140, 56, 0.42);
  background: var(--mission-orange-soft);
  color: var(--mission-orange);
}
.mission-status-badge.is-denied {
  border-color: rgba(63, 209, 141, 0.45);
  background: var(--mission-success-soft);
  color: var(--mission-success);
}

.mission-metric-tile {
  display: grid;
  gap: 2px;
  min-width: 0;
  padding: var(--mission-space-3);
  border: 1px solid var(--mission-border);
  border-radius: var(--mission-radius-md);
  background: rgba(4, 8, 13, 0.56);
}
.mission-metric-tile > span,
.mission-metric-label {
  color: var(--mission-text-tertiary);
  font-family: var(--mission-font-mono);
  font-size: 9px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.mission-metric-tile > strong,
.mission-metric-value {
  color: var(--mission-text-primary);
  font-family: var(--mission-font-mono);
  font-size: 22px;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.mission-metric-tile > small,
.mission-metric-help {
  color: var(--mission-text-tertiary);
  font-size: 10px;
  line-height: 1.35;
}
.mission-metric-tile.is-watch { border-color: rgba(241, 180, 90, 0.32); }
.mission-metric-tile.is-critical { border-color: rgba(240, 100, 118, 0.34); }
.mission-metric-tile.is-stable { border-color: rgba(63, 209, 141, 0.30); }

.mission-action-footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--mission-space-2);
  padding: var(--mission-space-4) var(--mission-space-5);
  border-top: 1px solid var(--mission-border);
  background: rgba(4, 8, 13, 0.62);
}

.mission-row-highlight {
  border-left: 3px solid var(--mission-warning);
  background: rgba(241, 180, 90, 0.06);
}

@keyframes mission-focus-pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(101, 214, 110, 0.44), var(--mission-shadow-soft);
    border-color: rgba(101, 214, 110, 0.54);
  }
  70% {
    box-shadow: 0 0 0 10px rgba(101, 214, 110, 0), var(--mission-shadow-soft);
  }
  100% {
    box-shadow: var(--mission-shadow-soft);
  }
}
.mission-focus-pulse {
  animation: mission-focus-pulse 1.9s var(--mission-ease-out) 1;
}

/* Skeleton loader (deferred animation respects prefers-reduced-motion). */
.mission-skeleton {
  background: linear-gradient(
    90deg,
    rgba(156, 184, 212, 0.06) 0%,
    rgba(156, 184, 212, 0.16) 50%,
    rgba(156, 184, 212, 0.06) 100%
  );
  background-size: 400px 100%;
  animation: mission-shimmer 1.5s linear infinite;
  border-radius: var(--mission-radius-sm);
}
@keyframes mission-shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}

/* Critical chip pulse — used on Zone Nord status chip. Subtle enough that
   COMEX viewers don't perceive it as marketing flicker. */
@keyframes mission-pulse-critical {
  0%, 100% { box-shadow: 0 0 0 0 rgba(240, 100, 118, 0.45); }
  50%      { box-shadow: 0 0 0 6px rgba(240, 100, 118, 0); }
}
.mission-pulse-critical {
  animation: mission-pulse-critical 2.4s ease-in-out infinite;
}

/* AYA assistant accent — used as a left-border on AYA-authored surfaces. */
.mission-aya-strip {
  position: relative;
}
.mission-aya-strip::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(180deg, var(--agentium-aya), rgba(242, 140, 56, 0.18));
}

/* Reduced-motion: kill the cockpit pulses and shimmer so demo VPs with
   vestibular preferences aren't distracted by the live chrome. */
@media (prefers-reduced-motion: reduce) {
  .mission-skeleton,
  .mission-pulse-critical,
  .mission-focus-pulse {
    animation: none !important;
  }
}

/* === tokens/cockpit-utilities.css === */
/* ============================================================================
   AGENTIUM — Cockpit Utility Classes
   --------------------------------------------------------------------------
   Drop-in helpers for cockpit-grade markup. All consume the --ck-* tokens
   from cockpit-tokens.scss. Use ONLY inside cockpit components — legacy
   pages keep using Tailwind utilities and design tokens from styles.scss.
   ============================================================================ */

/* ---------- Typography helpers ---------- */
.ck-mono {
  font-family: var(--ck-font-mono);
  font-feature-settings: "tnum", "zero";
}

.ck-tnum {
  font-variant-numeric: tabular-nums;
}

.ck-label {
  font-family: var(--ck-font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ck-fg-4);
}

.ck-label-sm {
  font-family: var(--ck-font-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ck-fg-5);
}

/* ---------- Hairlines ---------- */
.ck-hairline { background: var(--ck-stroke-2); }
.ck-hairline-h { height: 1px; background: var(--ck-stroke-2); }
.ck-hairline-v { width: 1px; background: var(--ck-stroke-2); }

/* ---------- Surfaces ---------- */
.ck-surface {
  background: var(--ck-bg-panel);
  border: 1px solid var(--ck-stroke-2);
  border-radius: var(--ck-radius-md);
}

.ck-surface-hi {
  background: var(--ck-bg-panel-hi);
  border: 1px solid var(--ck-stroke-2);
  border-radius: var(--ck-radius-md);
}

.ck-inset {
  background: var(--ck-bg-inset);
  border: 1px solid var(--ck-stroke-2);
}

/* ---------- Hero ambient — touches Concept B ---------- */
/* Subtle radial gradient reserved for executive surfaces (Hypervisor hero,
   Steering header, balance-sheet net-value tile). Never apply to dense
   list/table views. */
.ck-hero-ambient {
  position: relative;
  isolation: isolate;
}
.ck-hero-ambient::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(125, 211, 252, 0.06), transparent 60%),
    radial-gradient(ellipse at 80% 70%, rgba(167, 139, 250, 0.04), transparent 55%);
}

/* ---------- Ambient grid (faint 48px graph paper background) ---------- */
.ck-ambient-grid {
  position: relative;
  isolation: isolate;
}
.ck-ambient-grid::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.30;
  background-image:
    linear-gradient(var(--ck-stroke-1) 1px, transparent 1px),
    linear-gradient(90deg, var(--ck-stroke-1) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* ---------- LIVE pulse ---------- */
@keyframes ck-live-pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.45; }
}

.ck-live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ck-signal-pos);
  /* Touches Concept B: double box-shadow (close + far) for richer glow. */
  box-shadow:
    0 0 6px var(--ck-signal-pos),
    0 0 14px var(--ck-signal-pos);
  animation: ck-live-pulse 1.6s var(--ck-ease-in-out) infinite;
}
.ck-live-dot.cool   { background: var(--ck-signal-cool);   box-shadow: 0 0 6px var(--ck-signal-cool),   0 0 14px var(--ck-signal-cool); }
.ck-live-dot.violet { background: var(--ck-signal-violet); box-shadow: 0 0 6px var(--ck-signal-violet), 0 0 14px var(--ck-signal-violet); }
.ck-live-dot.warn   { background: var(--ck-signal-warn);   box-shadow: 0 0 6px var(--ck-signal-warn),   0 0 14px var(--ck-signal-warn); }
.ck-live-dot.neg    { background: var(--ck-signal-neg);    box-shadow: 0 0 6px var(--ck-signal-neg),    0 0 14px var(--ck-signal-neg); }
.ck-live-dot.neutral { background: var(--ck-fg-4); box-shadow: none; animation: none; }

/* ---------- Crosshair signal ---------- */
.ck-glow-cool   { filter: drop-shadow(0 0 6px var(--ck-signal-cool)); }
.ck-glow-pos    { filter: drop-shadow(0 0 6px var(--ck-signal-pos)); }
.ck-glow-violet { filter: drop-shadow(0 0 6px var(--ck-signal-violet)); }

/* ---------- Scrollbar (cockpit-flavored) ---------- */
.ck-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--ck-stroke-2) transparent;
}
.ck-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.ck-scroll::-webkit-scrollbar-track { background: transparent; }
.ck-scroll::-webkit-scrollbar-thumb {
  background: var(--ck-stroke-2);
  border-radius: 6px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
.ck-scroll::-webkit-scrollbar-thumb:hover {
  background: var(--ck-stroke-3);
  background-clip: padding-box;
  border: 2px solid transparent;
}

/* ---------- Side rail hover fly-out label ---------- */
.ck-rail-item {
  position: relative;
  text-decoration: none;
}

.ck-rail-item:hover {
  color: var(--ck-fg-1) !important;
  background: var(--ck-bg-panel-hi) !important;
}

.ck-rail-flyout {
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translate(-6px, -50%);
  min-width: 168px;
  padding: 8px 10px;
  background: var(--ck-bg-panel-hi);
  border: 1px solid var(--ck-stroke-3);
  border-radius: 4px;
  box-shadow: var(--ck-shadow-card);
  opacity: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  white-space: nowrap;
  transition:
    opacity 120ms var(--ck-ease-out),
    transform 120ms var(--ck-ease-out);
  z-index: 40;
}

.ck-rail-item:hover .ck-rail-flyout,
.ck-rail-item:focus-visible .ck-rail-flyout {
  opacity: 1;
  transform: translate(0, -50%);
}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .ck-live-dot { animation: none; }
  .ck-rail-flyout { transition: none; }
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}

      {children}

  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {

    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-src="sim.jsx">
// sim.jsx — moteur de simulation de la séance de capture.
// Expose window.useSession(opts) : un hook qui déroule buildScript() dans le temps,
// gère le streaming "provisoire → finalisé", les ancres déictiques selon le mode,
// et renvoie l'état du Fil + les commandes (play / pause / restart).
const { useState, useRef, useEffect, useCallback } = React;

let __uid = 0;
const uid = (p) => `${p}-${++__uid}`;

// Horloge → libellé "mm:ss" (départ fictif 14:31).
function clockLabel(ms) {
  const base = 14 * 3600 + 31 * 60; // 14:31:00
  const total = base + Math.floor(ms / 1000);
  const h = Math.floor(total / 3600) % 24;
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const p = (n) => String(n).padStart(2, '0');
  return `${p(h)}:${p(m)}:${p(s)}`;
}

const TICK = 90;            // ms par tick d'horloge
const WORDS_PER_TICK = 1.6; // débit de "frappe" de la parole streamée
const FINALIZE_DELAY = 420; // provisoire → finalisé
const HYBRID_CONFIRM = 4200; // ms avant auto-confirmation d'une ancre fantôme

function useSession({ speed = 1, oracleOn = true, pointingMode = 'hybride' } = {}) {
  // État exposé
  const [feed, setFeed] = useState([]);       // entrées du Fil (speak / note / anchor)
  const [scene, setScene] = useState([]);     // vues épinglées
  const [activeView, setActiveView] = useState(null);
  const [oracle, setOracle] = useState([]);   // pistes de l'oracle
  const [phase, setPhase] = useState('—');
  const [clock, setClock] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [done, setDone] = useState(false);
  const [awaitingGesture, setAwaitingGesture] = useState(null); // mode manuel

  // Refs internes au moteur (évitent les stale closures dans l'intervalle)
  const script = useRef(buildScript());
  const cursor = useRef(0);
  const clockRef = useRef(0);
  const nextAt = useRef(0);        // horloge à laquelle exécuter l'événement courant
  const streaming = useRef(null);  // { id, words, shown, pauseAfter }
  const opts = useRef({ speed, oracleOn, pointingMode });
  useEffect(() => { opts.current = { speed, oracleOn, pointingMode }; }, [speed, oracleOn, pointingMode]);

  const reset = useCallback(() => {
    cursor.current = 0;
    clockRef.current = 0;
    nextAt.current = 0;
    streaming.current = null;
    setFeed([]); setScene([]); setActiveView(null); setOracle([]);
    setPhase('—'); setClock(0); setDone(false); setAwaitingGesture(null);
    setPlaying(true);
  }, []);

  // Confirme une ancre fantôme (hybride) ou en attente.
  const confirmAnchor = useCallback((id) => {
    setFeed((f) => f.map((e) => e.id === id && e.kind === 'anchor'
      ? { ...e, status: 'confirmed' } : e));
  }, []);
  const discardAnchor = useCallback((id) => {
    setFeed((f) => f.map((e) => e.id === id && e.kind === 'anchor'
      ? { ...e, status: 'discarded' } : e));
  }, []);
  const rebindAnchor = useCallback((id, viewId) => {
    setFeed((f) => f.map((e) => e.id === id && e.kind === 'anchor'
      ? { ...e, viewId, status: 'confirmed', confidence: 1 } : e));
  }, []);

  // Geste explicite (mode manuel) : matérialise l'ancre en attente.
  const fireGesture = useCallback(() => {
    setAwaitingGesture((aw) => {
      if (!aw) return null;
      setFeed((f) => [...f, {
        id: uid('anc'), kind: 'anchor', t: clockLabel(clockRef.current),
        viewId: aw.viewId, confidence: 1, status: 'confirmed', phrase: aw.phrase,
      }]);
      return null;
    });
  }, []);

  // Insertion manuelle d'une note par l'utilisateur (composer).
  const addNote = useCallback((text) => {
    if (!text.trim()) return;
    setFeed((f) => [...f, {
      id: uid('note'), kind: 'note', t: clockLabel(clockRef.current),
      text: text.trim(), byUser: true,
    }]);
  }, []);

  // Exécute un événement du script.
  const runEvent = useCallback((ev) => {
    const m = opts.current.pointingMode;
    switch (ev.type) {
      case 'phase':
        setPhase(ev.label);
        break;
      case 'speak': {
        const id = uid('sp');
        const words = ev.text.split(' ');
        streaming.current = { id, words, shown: 0, pauseAfter: ev.pauseAfter || 400 };
        setFeed((f) => [...f, {
          id, kind: 'speak', t: clockLabel(clockRef.current), text: '', final: false,
        }]);
        return true; // streaming pilote l'avancement
      }
      case 'oracle':
        if (opts.current.oracleOn) {
          setOracle((o) => [...o, {
            id: uid('orc'), q: ev.q, tag: ev.tag, state: 'open',
            t: clockLabel(clockRef.current),
          }]);
        }
        break;
      case 'pin': {
        const view = VIEWS[ev.viewId];
        setScene((s) => s.find((v) => v.id === view.id) ? s : [...s, view]);
        setActiveView(view.id);
        break;
      }
      case 'show':
        setActiveView(ev.viewId);
        break;
      case 'deictic': {
        if (m === 'manuel') {
          // pas d'ancre tant que le geste n'est pas posé
          setAwaitingGesture({ viewId: ev.viewId, phrase: ev.phrase });
        } else {
          const lowConf = ev.confidence < 0.7;
          let status = 'confirmed';
          if (m === 'hybride') status = 'pending';
          else if (m === 'auto' && lowConf) status = 'lowconf';
          setFeed((f) => [...f, {
            id: uid('anc'), kind: 'anchor', t: clockLabel(clockRef.current),
            viewId: ev.viewId, confidence: ev.confidence, status,
            phrase: ev.phrase, ambiguousWith: ev.ambiguousWith || null,
            confirmAt: status === 'pending' ? clockRef.current + HYBRID_CONFIRM : null,
          }]);
        }
        break;
      }
      case 'gesture':
        if (m === 'manuel') fireGesture();
        break;
      case 'note':
        setFeed((f) => [...f, {
          id: uid('note'), kind: 'note', t: clockLabel(clockRef.current), text: ev.text,
        }]);
        break;
      default: break;
    }
    return false;
  }, [fireGesture]);

  // Boucle d'horloge
  useEffect(() => {
    const iv = setInterval(() => {
      if (!playing) return;
      const sp = opts.current.speed;
      clockRef.current += TICK * sp;
      setClock(clockRef.current);

      // 1) auto-confirmation des ancres fantômes (hybride)
      setFeed((f) => {
        let changed = false;
        const next = f.map((e) => {
          if (e.kind === 'anchor' && e.status === 'pending'
              && e.confirmAt != null && clockRef.current >= e.confirmAt) {
            changed = true; return { ...e, status: 'confirmed' };
          }
          return e;
        });
        return changed ? next : f;
      });

      // 2) streaming de la parole en cours
      if (streaming.current) {
        const st = streaming.current;
        st.shown = Math.min(st.words.length, st.shown + WORDS_PER_TICK * sp);
        const shownInt = Math.floor(st.shown);
        const text = st.words.slice(0, shownInt).join(' ');
        setFeed((f) => f.map((e) => e.id === st.id ? { ...e, text } : e));
        if (st.shown >= st.words.length) {
          const id = st.id, pause = st.pauseAfter;
          streaming.current = null;
          setTimeout(() => {
            setFeed((f) => f.map((e) => e.id === id ? { ...e, final: true } : e));
          }, FINALIZE_DELAY);
          nextAt.current = clockRef.current + pause;
        }
        return;
      }

      // 3) avancement du script
      if (cursor.current >= script.current.length) {
        if (!streaming.current) setDone(true);
        return;
      }
      if (clockRef.current >= nextAt.current) {
        const ev = script.current[cursor.current];
        cursor.current += 1;
        const isStreaming = runEvent(ev);
        // gap de l'événement SUIVANT (négatif = rétro-daté, traité comme 0)
        const nextEv = script.current[cursor.current];
        const gap = nextEv ? Math.max(0, nextEv.gap) : 0;
        if (!isStreaming) nextAt.current = clockRef.current + gap;
      }
    }, TICK);
    return () => clearInterval(iv);
  }, [playing, runEvent]);

  return {
    feed, scene, activeView, oracle, phase, clock, clockLabel,
    playing, done, awaitingGesture,
    setPlaying, restart: reset,
    confirmAnchor, discardAnchor, rebindAnchor, fireGesture, addNote,
    setOracleState: (id, state) =>
      setOracle((o) => o.map((q) => q.id === id ? { ...q, state } : q)),
  };
}

Object.assign(window, { useSession, clockLabel });

</script>

// ── Pastille d'état ───────────────────────────────────────────────────────
function Dot({ kind = 'pos', live = false, size = 6 }) {
