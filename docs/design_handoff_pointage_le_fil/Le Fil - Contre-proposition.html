<script type="text/babel" data-src="capture.jsx">
// capture.jsx — écran "Capture en direct" (le cœur). Mode Studio : chrome minimal,
// Le Fil au centre, La Scène + l'Oracle en périphérie atténuée.
const { useState: uS, useEffect: uE, useRef: uR } = React;

// ── Chip d'ancre déictique (inline dans le Fil) ───────────────────────────
function AnchorChip({ entry, scene, onConfirm, onDiscard, onRebind }) {
  const [rebinding, setRebinding] = uS(false);
  const [left, setLeft] = uS(0);
  const view = VIEWS[entry.viewId];
  const doc = DOCS[view.docId];
  const tint = TINT[doc.tint];

  // compte à rebours fantôme (hybride)
  uE(() => {
    if (entry.status !== 'pending' || entry.confirmAt == null) return;
    const tick = () => setLeft(Math.max(0, Math.ceil((entry.confirmAt - (window.__clock || 0)) / 1000)));
    tick(); const iv = setInterval(tick, 200); return () => clearInterval(iv);
  }, [entry.status, entry.confirmAt]);

  if (entry.status === 'discarded') {
    return (
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12,
        color: 'var(--ck-fg-5)', textDecoration: 'line-through', opacity: 0.6 }}>
        <Icon name="target" size={13} /> {view.label} — pointage annulé
      </span>
    );
  }

  const pending = entry.status === 'pending';
  const low = entry.status === 'lowconf';
  const accent = low ? 'var(--ck-signal-warn)' : pending ? 'var(--ck-fg-3)' : tint;

  return (
    <span style={{ display: 'inline-flex', flexDirection: 'column', gap: 6, maxWidth: 460 }}>
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '6px 10px',
        borderRadius: 999, alignSelf: 'flex-start',
        background: pending || low ? 'transparent' : `color-mix(in oklab, ${tint} 12%, transparent)`,
        border: `1px ${pending || low ? 'dashed' : 'solid'} ${pending || low ? accent : tint + '88'}`,
        color: 'var(--ck-fg-1)', animation: pending ? 'anc-breathe 2s ease-in-out infinite' : 'none' }}>
        <Icon name="target" size={14} style={{ color: accent }} />
        <span style={{ fontSize: 12.5, fontWeight: 600 }}>{view.label}</span>
        <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)' }}>
          {doc.kind === 'image' ? 'IMG' : 'p.' + view.page} · {doc.name.replace('.pdf', '').replace('.zip', '')}
        </span>
        {!pending && !low && <Icon name="check" size={12} style={{ color: tint }} />}
      </span>

      {/* bandeau d'action selon le statut */}
      {pending && !rebinding && (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, paddingLeft: 4 }}>
          <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10.5, color: 'var(--ck-fg-4)' }}>
            confirmation auto dans {left}s
          </span>
          <ChipBtn onClick={() => onConfirm(entry.id)} accent="var(--ck-signal-pos)"><Icon name="check" size={11} /> Confirmer</ChipBtn>
          <ChipBtn onClick={() => setRebinding(true)}><Icon name="target" size={11} /> Relier…</ChipBtn>
          <ChipBtn onClick={() => onDiscard(entry.id)} accent="var(--ck-signal-neg)"><Icon name="x" size={11} /></ChipBtn>
        </span>
      )}
      {low && !rebinding && (
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, paddingLeft: 4 }}>
          <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10.5, color: 'var(--ck-signal-warn)' }}>
            ⚠ association incertaine · « {entry.phrase} »
          </span>
          <ChipBtn onClick={() => setRebinding(true)} accent="var(--ck-signal-warn)"><Icon name="target" size={11} /> Corriger</ChipBtn>
          <ChipBtn onClick={() => onConfirm(entry.id)}><Icon name="check" size={11} /> OK</ChipBtn>
        </span>
      )}
      {rebinding && (
        <span style={{ display: 'flex', flexWrap: 'wrap', gap: 6, paddingLeft: 4, alignItems: 'center' }}>
          <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)' }}>relier à :</span>
          {scene.map((v) => (
            <ChipBtn key={v.id} onClick={() => { onRebind(entry.id, v.id); setRebinding(false); }}
              accent={v.id === entry.viewId ? 'var(--ck-signal-cool)' : undefined}>
              {v.label}
            </ChipBtn>
          ))}
          <ChipBtn onClick={() => setRebinding(false)}><Icon name="x" size={11} /></ChipBtn>
        </span>
      )}
    </span>
  );
}

function ChipBtn({ children, onClick, accent }) {
  const [h, setH] = uS(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ appearance: 'none', display: 'inline-flex', alignItems: 'center', gap: 4,
        fontFamily: 'var(--ck-font-sans)', fontSize: 11, fontWeight: 550, padding: '3px 8px',
        borderRadius: 'var(--ck-radius-sm)', cursor: 'pointer',
        border: `1px solid ${accent || 'var(--ck-stroke-2)'}`,
        background: h ? (accent ? `color-mix(in oklab, ${accent} 16%, transparent)` : 'var(--ck-tint-soft)') : 'transparent',
        color: accent || 'var(--ck-fg-2)' }}>
      {children}
    </button>
  );
}

// ── Entrée du Fil ─────────────────────────────────────────────────────────
function FeedEntry({ e, fs, scene, onConfirm, onDiscard, onRebind }) {
  const time = <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10,
    color: 'var(--ck-fg-5)', flex: 'none', width: 56, paddingTop: 4,
    fontVariantNumeric: 'tabular-nums' }}>{e.t}</span>;

  if (e.kind === 'speak') {
    return (
      <div style={{ display: 'flex', gap: 14 }}>
        {time}
        <p style={{ margin: 0, fontSize: fs, lineHeight: 1.62, textWrap: 'pretty',
          color: e.final ? 'var(--ck-fg-1)' : 'var(--ck-fg-3)',
          fontStyle: e.final ? 'normal' : 'italic' }}>
          {e.text}
          {!e.final && <span style={{ display: 'inline-block', width: 2, height: fs,
            background: 'var(--ck-signal-cool)', marginLeft: 3, verticalAlign: 'text-bottom',
            animation: 'cur-blink 1s steps(2) infinite' }} />}
        </p>
      </div>
    );
  }
  if (e.kind === 'note') {
    return (
      <div style={{ display: 'flex', gap: 14 }}>
        {time}
        <div style={{ display: 'flex', gap: 9, alignItems: 'flex-start', padding: '8px 12px',
          borderLeft: `2px solid ${e.byUser ? 'var(--ck-signal-cool)' : 'var(--ck-signal-violet)'}`,
          background: 'var(--ck-tint-faint)', borderRadius: '0 var(--ck-radius-sm) var(--ck-radius-sm) 0',
          maxWidth: 540 }}>
          <Icon name="pen" size={14} style={{ color: e.byUser ? 'var(--ck-signal-cool)' : 'var(--ck-signal-violet)', marginTop: 2 }} />
          <span style={{ fontSize: fs - 2, lineHeight: 1.5, color: 'var(--ck-fg-2)' }}>{e.text}</span>
        </div>
      </div>
    );
  }
  if (e.kind === 'anchor') {
    return (
      <div style={{ display: 'flex', gap: 14 }}>
        {time}
        <AnchorChip entry={e} scene={scene} onConfirm={onConfirm} onDiscard={onDiscard} onRebind={onRebind} />
      </div>
    );
  }
  return null;
}

// ── Indicateur micro (barres animées) ─────────────────────────────────────
function MicMeter({ active }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 2, height: 20 }}>
      {[0, 1, 2, 3, 4].map((i) => (
        <span key={i} style={{ width: 2.5, borderRadius: 2, background: active ? 'var(--ck-signal-cool)' : 'var(--ck-fg-5)',
          height: active ? undefined : 4,
          animation: active ? `mic-bar 0.9s ease-in-out ${i * 0.12}s infinite` : 'none' }} />
      ))}
    </div>
  );
}

// ── Carte oracle ──────────────────────────────────────────────────────────
function OracleCard({ q, onPin, onDismiss }) {
  if (q.state === 'dismissed') return null;
  const pinned = q.state === 'pinned';
  return (
    <div style={{ padding: '10px 11px', borderRadius: 'var(--ck-radius-md)',
      border: `1px solid ${pinned ? 'var(--ck-signal-violet)88' : 'var(--ck-stroke-2)'}`,
      background: pinned ? 'color-mix(in oklab, var(--ck-signal-violet) 9%, transparent)' : 'var(--ck-bg-inset)',
      display: 'flex', flexDirection: 'column', gap: 7 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <Icon name="spark" size={12} style={{ color: 'var(--ck-signal-violet)' }} />
        <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 8.5, letterSpacing: '0.12em',
          textTransform: 'uppercase', color: 'var(--ck-signal-violet)' }}>{q.tag}</span>
        <span style={{ marginLeft: 'auto', fontFamily: 'var(--ck-font-mono)', fontSize: 9,
          color: 'var(--ck-fg-5)' }}>{q.t}</span>
      </div>
      <p style={{ margin: 0, fontSize: 12.5, lineHeight: 1.45, color: 'var(--ck-fg-2)' }}>{q.q}</p>
      <div style={{ display: 'flex', gap: 6 }}>
        <ChipBtn onClick={onPin} accent={pinned ? 'var(--ck-signal-violet)' : undefined}>
          <Icon name="pin" size={11} /> {pinned ? 'À traiter' : 'Garder'}
        </ChipBtn>
        <ChipBtn onClick={onDismiss}><Icon name="x" size={11} /> Ignorer</ChipBtn>
      </div>
    </div>
  );
}

// ── Écran de capture ──────────────────────────────────────────────────────
function CaptureScreen({ tweaks, onFinish, offline, onToggleOffline }) {
  const sess = useSession({ speed: tweaks.speed, oracleOn: tweaks.oracle, pointingMode: tweaks.pointing });
  const [draft, setDraft] = uS('');
  const feedRef = uR(null);

  // clock global lu par les chips (compte à rebours)
  uE(() => { window.__clock = sess.clock; }, [sess.clock]);

  // auto-scroll du Fil
  uE(() => { const el = feedRef.current; if (el) el.scrollTop = el.scrollHeight; }, [sess.feed]);

  const fs = { compact: 15, regular: 17, comfy: 19 }[tweaks.density] || 17;
  const activeView = sess.activeView ? VIEWS[sess.activeView] : null;
  const refsCount = sess.feed.filter((e) => e.kind === 'anchor' && e.status === 'confirmed').length;
  const aw = sess.awaitingGesture;

  const submitNote = () => { if (draft.trim()) { sess.addNote(draft); setDraft(''); } };

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
      background: 'var(--ck-bg-base)' }}>
      {/* barre de statut (calme) */}
      <div style={{ height: 50, flex: 'none', display: 'flex', alignItems: 'center', gap: 14,
        padding: '0 18px', borderBottom: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)' }}>
        <Dot kind={offline ? 'warn' : 'neg'} live={!offline} />
        <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 11, color: offline ? 'var(--ck-signal-warn)' : 'var(--ck-signal-neg)',
          fontWeight: 700, letterSpacing: '0.08em' }}>{offline ? 'HORS-LIGNE · buffer local' : 'CAPTURE'}</span>
        <span style={{ width: 1, height: 18, background: 'var(--ck-stroke-2)' }} />
        <span style={{ fontSize: 13, color: 'var(--ck-fg-1)', fontWeight: 600 }}>Résidence Belvédère — Lot 7</span>
        <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 12, color: 'var(--ck-fg-3)',
          fontVariantNumeric: 'tabular-nums' }}>{clockLabel(sess.clock)}</span>
        <Label style={{ marginLeft: 4 }}>{sess.phase}</Label>

        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)',
            padding: '3px 8px', border: '1px solid var(--ck-stroke-2)', borderRadius: 999 }}>
            pointage · {tweaks.pointing}
          </span>
          <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)' }}>
            {refsCount} réf.
          </span>
          <Btn size="sm" variant="bare" icon="wifioff" onClick={onToggleOffline}
            title="Simuler une perte réseau">{offline ? 'Rétablir' : ''}</Btn>
          <Btn size="sm" variant="bare" icon={sess.playing ? 'pause' : 'play'}
            onClick={() => sess.setPlaying(!sess.playing)} />
          <Btn size="sm" variant="bare" icon="restart" onClick={sess.restart} title="Rejouer" />
          <Btn size="sm" variant="primary" icon="arrow" onClick={onFinish}>Terminer la capture</Btn>
        </div>
      </div>

      {/* bandeau hors-ligne */}
      {offline && (
        <div style={{ flex: 'none', padding: '8px 18px', background: 'color-mix(in oklab, var(--ck-signal-warn) 12%, var(--ck-bg-panel))',
          borderBottom: '1px solid var(--ck-signal-warn)44', display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="wifioff" size={14} style={{ color: 'var(--ck-signal-warn)' }} />
          <span style={{ fontSize: 12, color: 'var(--ck-fg-1)' }}>
            Réseau perdu — <b>la capture continue en local</b>. Transcription et pointages sont mis en file, synchronisés à la reprise. Rien n'est perdu.
          </span>
        </div>
      )}

      {/* corps 3 colonnes */}
      <div style={{ flex: 1, display: 'grid',
        gridTemplateColumns: tweaks.oracle ? '58px 1fr 340px' : '58px 1fr 300px', minHeight: 0 }}>
        {/* col 1 — spine temporelle */}
        <div style={{ borderRight: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)',
          display: 'flex', flexDirection: 'column', alignItems: 'center', paddingTop: 16, gap: 2 }}>
          <Icon name="mic" size={16} style={{ color: 'var(--ck-signal-cool)' }} />
          <MicMeter active={sess.playing && !offline} />
          <div style={{ flex: 1, width: 1, background: 'var(--ck-stroke-2)', marginTop: 14, position: 'relative' }}>
            {[0, 1, 2, 3, 4, 5, 6].map((i) => (
              <span key={i} style={{ position: 'absolute', left: -2, top: `${i * 15}%`, width: 5, height: 1,
                background: 'var(--ck-stroke-3)' }} />
            ))}
          </div>
          <span style={{ writingMode: 'vertical-rl', fontFamily: 'var(--ck-font-mono)', fontSize: 8.5,
            letterSpacing: '0.18em', color: 'var(--ck-fg-5)', textTransform: 'uppercase', padding: '8px 0' }}>
            le fil
          </span>
        </div>

        {/* col 2 — Le Fil + composer */}
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: 0, minWidth: 0 }}>
          <div ref={feedRef} className="ck-scroll" style={{ flex: 1, overflowY: 'auto', padding: '24px 30px',
            display: 'flex', flexDirection: 'column', gap: 16 }}>
            {sess.feed.length === 0 && (
              <div style={{ color: 'var(--ck-fg-4)', fontSize: 13, fontStyle: 'italic', marginTop: 20 }}>
                En écoute… la parole et l'écrit s'inscrivent ici, sur un seul fil horodaté.
              </div>
            )}
            {sess.feed.map((e) => (
              <FeedEntry key={e.id} e={e} fs={fs} scene={sess.scene}
                onConfirm={sess.confirmAnchor} onDiscard={sess.discardAnchor} onRebind={sess.rebindAnchor} />
            ))}
          </div>

          {/* composer — modalité unique */}
          <div style={{ flex: 'none', padding: '14px 30px 18px', borderTop: '1px solid var(--ck-stroke-2)',
            background: 'var(--ck-bg-panel)' }}>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 12,
              border: '1px solid var(--ck-stroke-3)', borderRadius: 'var(--ck-radius-lg)',
              background: 'var(--ck-bg-inset)', padding: '10px 12px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, paddingBottom: 2 }}>
                <Icon name="mic" size={16} style={{ color: sess.playing && !offline ? 'var(--ck-signal-cool)' : 'var(--ck-fg-4)' }} />
                <MicMeter active={sess.playing && !offline} />
              </div>
              <span style={{ width: 1, height: 22, background: 'var(--ck-stroke-2)' }} />
              <textarea value={draft} onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitNote(); } }}
                rows={1} placeholder="Écrire une note — s'insère dans le Fil  ·  la voix est captée en continu"
                style={{ flex: 1, resize: 'none', border: 'none', outline: 'none', background: 'transparent',
                  color: 'var(--ck-fg-1)', fontFamily: 'var(--ck-font-sans)', fontSize: 14, lineHeight: 1.5,
                  maxHeight: 90 }} />
              <Btn size="sm" variant={draft.trim() ? 'primary' : 'ghost'} icon="pen" onClick={submitNote}
                disabled={!draft.trim()}>Insérer</Btn>
            </div>
            <div style={{ display: 'flex', gap: 16, marginTop: 7, paddingLeft: 4 }}>
              <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5, color: 'var(--ck-fg-5)' }}>↵ insérer</span>
              <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5, color: 'var(--ck-fg-5)' }}>⇧↵ nouvelle ligne</span>
              <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5, color: 'var(--ck-fg-5)' }}>voix ⇄ écrit : même flux</span>
            </div>
          </div>
        </div>

        {/* col 3 — La Scène + Oracle */}
        <div style={{ borderLeft: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)',
          display: 'flex', flexDirection: 'column', minHeight: 0 }}>
          {/* Scène */}
          <div style={{ flex: tweaks.oracle ? '1 1 56%' : '1 1 100%', display: 'flex', flexDirection: 'column',
            minHeight: 0, overflow: 'hidden', padding: '14px 14px 10px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, flex: 'none' }}>
              <Icon name="layers" size={13} style={{ color: 'var(--ck-fg-3)' }} />
              <Label>La Scène · {sess.scene.length} pièce{sess.scene.length > 1 ? 's' : ''}</Label>
            </div>
            {/* vue active, agrandie */}
            {activeView ? (
              <div style={{ flex: '1 1 auto', minHeight: 0, marginBottom: 12, display: 'flex',
                justifyContent: 'center' }}>
                <div style={{ position: 'relative', height: '100%', maxWidth: '100%' }}>
                  <ViewTile view={activeView} size="xl" active style={{ height: '100%', width: 'auto' }} />
                  {/* mode manuel : cible pulsante à pointer */}
                  {aw && aw.viewId === activeView.id && (
                    <button onClick={sess.fireGesture} style={{ position: 'absolute', inset: 0,
                      display: 'grid', placeItems: 'center', background: 'color-mix(in oklab, var(--ck-bg-void) 35%, transparent)',
                      border: '2px dashed var(--ck-signal-cool)', borderRadius: 'var(--ck-radius-md)',
                      cursor: 'pointer', appearance: 'none' }}>
                      <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
                        color: 'var(--ck-signal-cool)', animation: 'anc-breathe 1.4s ease-in-out infinite' }}>
                        <Icon name="target" size={32} />
                        <span style={{ fontSize: 11.5, fontWeight: 600 }}>Pointer cette vue</span>
                        <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5 }}>« {aw.phrase} »</span>
                      </span>
                    </button>
                  )}
                </div>
              </div>
            ) : (
              <div style={{ flex: '1 1 auto', minHeight: 90, border: '1px dashed var(--ck-stroke-3)',
                borderRadius: 'var(--ck-radius-md)', display: 'grid', placeItems: 'center',
                color: 'var(--ck-fg-5)', fontSize: 12, marginBottom: 12 }}>aucune pièce montrée</div>
            )}
            {/* pellicule des autres pièces */}
            <div className="ck-scroll" style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 4,
              flex: 'none' }}>
              {sess.scene.map((v) => (
                <div key={v.id} style={{ flex: 'none', width: 84 }}>
                  <ViewTile view={v} size="sm" dim={v.id !== sess.activeView}
                    active={v.id === sess.activeView} onClick={() => {}} />
                </div>
              ))}
            </div>
          </div>

          {/* Oracle */}
          {tweaks.oracle && (
            <div style={{ flex: '1 1 44%', display: 'flex', flexDirection: 'column', minHeight: 0,
              borderTop: '1px solid var(--ck-stroke-2)', padding: '14px 14px 14px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                <Icon name="spark" size={13} style={{ color: 'var(--ck-signal-violet)' }} />
                <Label>Pistes de l'oracle</Label>
                <span style={{ marginLeft: 'auto', fontFamily: 'var(--ck-font-mono)', fontSize: 9,
                  color: 'var(--ck-fg-5)' }}>non bloquant</span>
              </div>
              <div className="ck-scroll" style={{ flex: 1, overflowY: 'auto', display: 'flex',
                flexDirection: 'column', gap: 8 }}>
                {sess.oracle.filter((q) => q.state !== 'dismissed').length === 0 && (
                  <span style={{ color: 'var(--ck-fg-5)', fontSize: 12, fontStyle: 'italic' }}>
                    L'oracle écoute… il déposera ici des questions d'approfondissement.
                  </span>
                )}
                {sess.oracle.map((q) => (
                  <OracleCard key={q.id} q={q}
                    onPin={() => sess.setOracleState(q.id, q.state === 'pinned' ? 'open' : 'pinned')}
                    onDismiss={() => sess.setOracleState(q.id, 'dismissed')} />
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { CaptureScreen });

</script>

<script type="text/babel" data-src="flows.jsx">
// flows.jsx — écrans périphériques du parcours :
// FinScreen (triage pré-rempli) · IndexScreen (indexation fond) ·
// PiecesScreen (pièces & pointage + comparatif des 2 approches) · EdgeScreen (cas limites)
const { useState: fS, useEffect: fE, useRef: fR } = React;

const SHARE = {
  full: { label: 'Entier', dot: 'pos' },
  excerpt: { label: 'Extrait', dot: 'cool' },
  none: { label: 'Aucun', dot: 'neutral' },
};

// petit segmenté inline
function Seg({ value, options, onChange }) {
  return (
    <div style={{ display: 'inline-flex', padding: 2, borderRadius: 'var(--ck-radius-md)',
      background: 'var(--ck-bg-void)', border: '1px solid var(--ck-stroke-2)', gap: 2 }}>
      {options.map((o) => {
        const on = o.value === value;
        return (
          <button key={o.value} onClick={() => onChange(o.value)} style={{ appearance: 'none',
            display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px',
            borderRadius: 'var(--ck-radius-sm)', cursor: 'pointer', border: 'none',
            fontFamily: 'var(--ck-font-sans)', fontSize: 11.5, fontWeight: 550,
            background: on ? 'var(--ck-bg-panel-hi)' : 'transparent',
            color: on ? 'var(--ck-fg-1)' : 'var(--ck-fg-4)',
            boxShadow: on ? 'var(--ck-shadow-card)' : 'none' }}>
            <Dot kind={o.dot} size={5} />{o.label}
          </button>
        );
      })}
    </div>
  );
}

// ── Triage de fin (récapitulatif pré-rempli, pas de formulaire) ───────────
function FinScreen({ onOpenReport }) {
  const [rows, setRows] = fS(TRIAGE.map((r) => ({ ...r, choice: r.proposal })));
  const shareCount = rows.filter((r) => r.choice !== 'none').length;
  return (
    <div className="ck-scroll" style={{ position: 'absolute', inset: 0, overflowY: 'auto',
      background: 'var(--ck-bg-base)', display: 'flex', justifyContent: 'center' }}>
      <div style={{ width: 'min(760px, 100%)', padding: '46px 28px 60px' }}>
        <Label>Fin de séance · étape légère</Label>
        <h1 style={{ margin: '12px 0 8px', fontSize: 28, fontWeight: 680, color: 'var(--ck-fg-1)',
          letterSpacing: '-0.01em' }}>Confirmer ce qui est partagé</h1>
        <p style={{ margin: 0, fontSize: 14.5, lineHeight: 1.55, color: 'var(--ck-fg-3)', maxWidth: 580 }}>
          Le niveau de partage est <b style={{ color: 'var(--ck-fg-2)' }}>déduit de votre usage</b> pendant la séance.
          Vous ne remplissez rien — vous corrigez si besoin. Tout reste réversible depuis le rapport.
        </p>

        <div style={{ marginTop: 28, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {rows.map((r, i) => {
            const doc = DOCS[r.docId];
            const tint = TINT[doc.tint];
            return (
              <div key={r.docId} style={{ display: 'flex', alignItems: 'center', gap: 16,
                padding: '14px 16px', borderRadius: 'var(--ck-radius-lg)',
                border: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)',
                opacity: r.choice === 'none' ? 0.62 : 1, transition: 'opacity var(--ck-dur-med)' }}>
                <div style={{ width: 34, height: 42, flex: 'none', borderRadius: 'var(--ck-radius-sm)',
                  border: `1px solid ${tint}66`, background: `repeating-linear-gradient(0deg, var(--ck-stroke-1) 0 5px, transparent 5px 6px)`,
                  display: 'grid', placeItems: 'center', color: tint }}>
                  <Icon name={doc.kind === 'image' ? 'image' : 'doc'} size={15} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 12.5, color: 'var(--ck-fg-1)',
                    fontWeight: 600 }}>{doc.name}</div>
                  <div style={{ fontSize: 12, color: 'var(--ck-fg-4)', marginTop: 3 }}>{r.reason}</div>
                </div>
                <Seg value={r.choice} onChange={(v) => setRows((rs) => rs.map((x, j) => j === i ? { ...x, choice: v } : x))}
                  options={[{ value: 'full', ...SHARE.full }, { value: 'excerpt', ...SHARE.excerpt }, { value: 'none', ...SHARE.none }]} />
              </div>
            );
          })}
        </div>

        <div style={{ marginTop: 22, padding: '14px 16px', borderRadius: 'var(--ck-radius-md)',
          border: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-inset)', display: 'flex',
          gap: 11, alignItems: 'flex-start' }}>
          <Icon name="layers" size={16} style={{ color: 'var(--ck-signal-violet)', marginTop: 1 }} />
          <span style={{ fontSize: 12.5, lineHeight: 1.5, color: 'var(--ck-fg-3)' }}>
            L'<b style={{ color: 'var(--ck-fg-2)' }}>indexation lourde</b> (extraction + vectorisation) démarre en arrière-plan
            <b style={{ color: 'var(--ck-fg-2)' }}> dès l'ouverture du rapport</b>. Vous lisez immédiatement ; les sources
            deviennent cliquables au fil de l'indexation.
          </span>
        </div>

        <div style={{ marginTop: 26, display: 'flex', alignItems: 'center', gap: 16 }}>
          <Btn variant="primary" size="lg" icon="arrow" onClick={onOpenReport}>Ouvrir le rapport</Btn>
          <span style={{ fontSize: 12.5, color: 'var(--ck-fg-4)' }}>
            {shareCount} document{shareCount > 1 ? 's' : ''} partagé{shareCount > 1 ? 's' : ''} · indexation en file
          </span>
        </div>
      </div>
    </div>
  );
}

// ── Indexation en arrière-plan ────────────────────────────────────────────
function IndexScreen() {
  const order = ['none', 'referenced', 'queued', 'indexing', 'indexed'];
  const init = TRIAGE.filter((r) => r.proposal !== 'none')
    .map((r) => ({ docId: r.docId, state: r.index, progress: r.index === 'referenced' ? 100 : 0 }));
  const [items, setItems] = fS(init);
  const [running, setRunning] = fS(true);

  fE(() => {
    if (!running) return;
    const iv = setInterval(() => {
      setItems((list) => {
        // une seule indexation à la fois (file)
        const idxIndexing = list.findIndex((x) => x.state === 'indexing');
        if (idxIndexing >= 0) {
          return list.map((x, i) => i === idxIndexing
            ? (x.progress >= 100 ? { ...x, state: 'indexed' } : { ...x, progress: Math.min(100, x.progress + 9) })
            : x);
        }
        const idxQueued = list.findIndex((x) => x.state === 'queued');
        if (idxQueued >= 0) return list.map((x, i) => i === idxQueued ? { ...x, state: 'indexing', progress: 4 } : x);
        return list;
      });
    }, 260);
    return () => clearInterval(iv);
  }, [running]);

  const allDone = items.every((x) => x.state === 'indexed' || x.state === 'referenced');
  const pct = Math.round(items.reduce((a, x) => a + (x.state === 'indexed' ? 100 : x.state === 'referenced' ? 100 : x.progress), 0) / items.length);

  return (
    <div className="ck-scroll" style={{ position: 'absolute', inset: 0, overflowY: 'auto',
      background: 'var(--ck-bg-base)', display: 'flex', justifyContent: 'center' }}>
      <div style={{ width: 'min(720px, 100%)', padding: '46px 28px 60px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <Label>Moteur · arrière-plan</Label>
          <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 7,
            fontFamily: 'var(--ck-font-mono)', fontSize: 11, color: allDone ? 'var(--ck-signal-pos)' : 'var(--ck-signal-violet)' }}>
            <Dot kind={allDone ? 'pos' : 'violet'} live={!allDone} /> {allDone ? 'terminé' : pct + '%'}
          </span>
        </div>
        <h1 style={{ margin: '12px 0 8px', fontSize: 26, fontWeight: 680, color: 'var(--ck-fg-1)' }}>
          Indexation discrète, jamais bloquante
        </h1>
        <p style={{ margin: '0 0 24px', fontSize: 14, lineHeight: 1.55, color: 'var(--ck-fg-3)', maxWidth: 560 }}>
          Le rapport est <b style={{ color: 'var(--ck-fg-2)' }}>déjà ouvert et lisible</b>. Ce moteur tourne derrière —
          un seul indicateur de pouls suffit. Aucune action requise.
        </p>

        {/* fil de progression global */}
        <div style={{ height: 3, borderRadius: 999, background: 'var(--ck-stroke-2)', overflow: 'hidden', marginBottom: 26 }}>
          <div style={{ height: '100%', width: pct + '%', background: 'var(--ck-signal-violet)',
            boxShadow: 'var(--ck-glow-violet)', transition: 'width 0.26s linear' }} />
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {items.map((x) => {
            const doc = DOCS[x.docId];
            const st = INDEX_STATES[x.state];
            return (
              <div key={x.docId} style={{ display: 'flex', alignItems: 'center', gap: 14,
                padding: '12px 15px', borderRadius: 'var(--ck-radius-md)',
                border: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)' }}>
                <Dot kind={st.dot} live={x.state === 'indexing'} />
                <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 12.5, color: 'var(--ck-fg-1)',
                  flex: 1, minWidth: 0 }}>{doc.name}</span>
                {x.state === 'indexing' && (
                  <div style={{ width: 120, height: 3, borderRadius: 999, background: 'var(--ck-stroke-2)', overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: x.progress + '%', background: st.fg, transition: 'width 0.26s linear' }} />
                  </div>
                )}
                <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 11, color: st.fg, width: 92,
                  textAlign: 'right', fontWeight: 600 }}>{st.label}</span>
              </div>
            );
          })}
        </div>

        <div style={{ marginTop: 22, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          {order.map((k) => (
            <span key={k} style={{ display: 'inline-flex', alignItems: 'center', gap: 6,
              fontFamily: 'var(--ck-font-mono)', fontSize: 10.5, color: 'var(--ck-fg-4)' }}>
              <Dot kind={INDEX_STATES[k].dot} size={5} /> {INDEX_STATES[k].label}
            </span>
          ))}
          <Btn size="sm" variant="bare" icon="restart" style={{ marginLeft: 'auto' }}
            onClick={() => { setItems(init.map((x) => ({ ...x, state: x.docId === 'photos' ? 'referenced' : 'queued', progress: 0 }))); setRunning(true); }}>
            Rejouer
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ── Pièces & pointage : modèle + comparatif des 2 approches ───────────────
function PointDemo({ mode, phrase, view, recommended }) {
  const doc = DOCS[view.docId];
  const tint = TINT[doc.tint];
  const meta = {
    auto: { title: 'Auto-détection', dot: 'cool',
      desc: 'L\'ancre se pose seule dès la phrase déictique. Zéro action — mais une mauvaise association passe inaperçue.',
      cost: 'Effort : nul', risk: 'Risque : faux positif silencieux' },
    manuel: { title: 'Geste manuel', dot: 'warn',
      desc: 'L\'expert tape la pièce (ou raccourci) pour pointer. Fiable à 100 % — mais demande une micro-action à chaque fois.',
      cost: 'Effort : 1 tap', risk: 'Risque : oubli de pointer' },

}

function PiecesScreen() {
  const views = [VIEWS.v_coupe, VIEWS.v_sp3, VIEWS.v_essais, VIEWS.v_fissure];
  const [active, setActive] = fS('v_coupe');

    <div className="ck-scroll" style={{ position: 'absolute', inset: 0, overflowY: 'auto',

                border: `1px solid ${v.id === active ? TINT[DOCS[v.docId].tint] : 'var(--ck-stroke-2)'}`,

                <div style={{ width: 44, height: 33, flex: 'none', pointerEvents: 'none' }}><ViewTile view={v} size="sm" active={v.id === active} dim={v.id !== active} /></div>

                  </div>

                {v.id === active && <span style={{ marginLeft: 'auto', fontFamily: 'var(--ck-font-mono)',
                  fontSize: 8.5, color: TINT[DOCS[v.docId].tint], fontWeight: 700 }}>EN SCÈNE</span>}

        </div>

        <h2 style={{ margin: '0 0 6px', fontSize: 18, fontWeight: 650, color: 'var(--ck-fg-1)' }}>
          Pointage : deux approches, une recommandation
        </h2>
        <p style={{ margin: '0 0 18px', fontSize: 13.5, lineHeight: 1.5, color: 'var(--ck-fg-3)', maxWidth: 620 }}>
          Réponse directe à votre question ouverte « auto vs manuel ». Voici les deux extrêmes, puis l'option hybride

        <div style={{ display: 'flex', gap: 14, alignItems: 'stretch', flexWrap: 'wrap' }}>

          <PointDemo mode="hybride" phrase="cette coupe" view={VIEWS.v_coupe} recommended />
        </div>
      </div>
    </div>

}

// ── Cas limites ───────────────────────────────────────────────────────────
function EdgeCard({ icon, iconKind, title, children, mock }) {

function EdgeScreen() {
  return (
    <div className="ck-scroll" style={{ position: 'absolute', inset: 0, overflowY: 'auto',
      background: 'var(--ck-bg-base)', display: 'flex', justifyContent: 'center' }}>

        <h1 style={{ margin: '12px 0 8px', fontSize: 26, fontWeight: 680, color: 'var(--ck-fg-1)' }}>Cas limites & états</h1>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16 }}>

              <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)' }}>relier à :</span>

                <span key={v.id} style={{ padding: '4px 9px', borderRadius: 'var(--ck-radius-sm)', fontSize: 11,
                  border: `1px solid ${v.id === 'v_sp3' ? 'var(--ck-signal-cool)' : 'var(--ck-stroke-2)'}`,

            Chaque ancre reste cliquable : <b style={{ color: 'var(--ck-fg-2)' }}>« Relier… »</b> rebascule la référence

          </EdgeCard>

          <EdgeCard icon="question" iconKind="warn" title="Déictique ambigu"
            mock={<span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '6px 10px',
              borderRadius: 999, border: '1px dashed var(--ck-signal-warn)', color: 'var(--ck-signal-warn)', fontSize: 11.5 }}>
              <Icon name="target" size={13} /> 2 vues à l'écran — « ici » ?
            </span>}>
            Si deux pièces sont en scène, la confiance chute : l'ancre s'affiche en
            <b style={{ color: 'var(--ck-signal-warn)' }}> incertain</b> avec choix explicite, jamais une fausse certitude.
          </EdgeCard>

          <EdgeCard icon="wifioff" iconKind="warn" title="Perte réseau"
            mock={<span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '7px 11px',
              borderRadius: 'var(--ck-radius-md)', background: 'color-mix(in oklab, var(--ck-signal-warn) 14%, transparent)',
              border: '1px solid var(--ck-signal-warn)44', color: 'var(--ck-fg-1)', fontSize: 11.5 }}>
              <Icon name="wifioff" size={14} style={{ color: 'var(--ck-signal-warn)' }} /> Capture locale · file de synchro
            </span>}>
            La capture ne dépend pas du réseau : transcription et pointages sont <b style={{ color: 'var(--ck-fg-2)' }}>bufferisés
            en local</b> puis synchronisés à la reprise. Bandeau discret, zéro interruption.
          </EdgeCard>

          <EdgeCard icon="restart" iconKind="pos" title="Reprise de séance"
            mock={<div style={{ padding: '10px 13px', borderRadius: 'var(--ck-radius-md)', background: 'var(--ck-bg-panel)',
              border: '1px solid var(--ck-stroke-2)', display: 'flex', flexDirection: 'column', gap: 8, minWidth: 200 }}>
              <span style={{ fontSize: 12, color: 'var(--ck-fg-1)' }}>Séance interrompue à <b>14:38</b></span>
              <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)' }}>3 pièces · 5 réf · 2 notes</span>
              <div style={{ display: 'flex', gap: 6 }}>
                <span style={{ padding: '3px 9px', borderRadius: 'var(--ck-radius-sm)', fontSize: 10.5,
                  background: 'var(--ck-signal-cool)', color: 'var(--ck-on-signal)', fontWeight: 600 }}>Reprendre</span>
                <span style={{ padding: '3px 9px', borderRadius: 'var(--ck-radius-sm)', fontSize: 10.5,
                  border: '1px solid var(--ck-stroke-2)', color: 'var(--ck-fg-3)' }}>Clôturer</span>
              </div>
            </div>}>
            L'état du Fil est persistant. À la réouverture, une carte propose de
            <b style={{ color: 'var(--ck-fg-2)' }}> reprendre exactement où on s'est arrêté</b> — contexte et scène restaurés.
          </EdgeCard>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { FinScreen, IndexScreen, PiecesScreen, EdgeScreen });

</script>

<script type="text/babel" data-src="report.jsx">
// report.jsx — lecture du rapport publié. Mode Cockpit (dense). Sources cliquables :
// chaque affirmation porte un marqueur → ouvre l'inspecteur de provenance
// (vue pointée + zone surlignée + retour à l'instant du transcript).
const { useState: rS } = React;

// instants de transcript associés aux sources (provenance bidirectionnelle)
const SRC_MOMENT = {
  v_coupe: '14:31:24', v_sp3: '14:32:58', v_essais: '14:33:41', v_fissure: '14:35:12',
};

function SourceMark({ n, view, active, onClick }) {
  const tint = view ? TINT[DOCS[view.docId].tint] : 'var(--ck-fg-4)';
  return (
    <button onClick={onClick} title={view ? `${DOCS[view.docId].name} · p.${view.page}` : ''}
      style={{ appearance: 'none', cursor: 'pointer', verticalAlign: 'super', marginLeft: 3,
        display: 'inline-flex', alignItems: 'center', gap: 3, padding: '1px 6px 1px 5px',
        borderRadius: 999, lineHeight: 1,
        border: `1px solid ${active ? tint : tint + '55'}`,
        background: active ? `color-mix(in oklab, ${tint} 22%, transparent)` : `color-mix(in oklab, ${tint} 9%, transparent)`,
        color: tint, fontFamily: 'var(--ck-font-mono)', fontSize: 9.5, fontWeight: 700 }}>
      <Icon name="target" size={9} /> {n}
    </button>
  );
}

function ReportScreen() {
  const [sel, setSel] = rS('v_coupe');
  // n° de source par vue (ordre d'apparition)
  const seq = []; REPORT.sections.forEach((s) => s.body.forEach((b) => { if (b.src && !seq.includes(b.src)) seq.push(b.src); }));
  const numOf = (src) => seq.indexOf(src) + 1;
  const selView = sel ? VIEWS[sel] : null;
  const selDoc = selView ? DOCS[selView.docId] : null;
  const selIndexed = sel === 'v_coupe' || sel === 'v_sp3' || sel === 'v_essais'; // photos = référencé seulement
  const tint = selView ? TINT[selDoc.tint] : 'var(--ck-signal-cool)';

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'grid', gridTemplateColumns: '1fr 396px',
      background: 'var(--ck-bg-base)' }}>
      {/* document */}
      <div style={{ display: 'flex', flexDirection: 'column', minWidth: 0, borderRight: '1px solid var(--ck-stroke-2)' }}>
        {/* en-tête + pouls d'indexation */}
        <div style={{ flex: 'none', padding: '16px 28px', borderBottom: '1px solid var(--ck-stroke-2)',
          background: 'var(--ck-bg-panel)', display: 'flex', alignItems: 'center', gap: 14 }}>
          <Icon name="book" size={17} style={{ color: 'var(--ck-fg-3)' }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 13.5, fontWeight: 650, color: 'var(--ck-fg-1)', whiteSpace: 'nowrap',
              overflow: 'hidden', textOverflow: 'ellipsis' }}>{REPORT.title}</div>
            <div style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)', marginTop: 2 }}>{REPORT.ref}</div>
          </div>
          <span style={{ marginLeft: 'auto', display: 'inline-flex', alignItems: 'center', gap: 7,
            padding: '5px 10px', borderRadius: 999, border: '1px solid var(--ck-stroke-2)',
            background: 'var(--ck-bg-inset)' }}>
            <Dot kind="violet" live /><span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10,
              color: 'var(--ck-fg-3)' }}>indexation 2/3 · sources cliquables au fil</span>
          </span>
        </div>

        {/* corps */}
        <div className="ck-scroll ck-ambient-grid" style={{ flex: 1, overflowY: 'auto', padding: '34px 0' }}>
          <div style={{ maxWidth: 660, margin: '0 auto', padding: '0 28px' }}>
            {REPORT.sections.map((s, i) => (
              <div key={i} style={{ marginBottom: 34 }}>
                <h2 style={{ margin: '0 0 14px', fontSize: 12, fontWeight: 700, letterSpacing: '0.06em',
                  textTransform: 'uppercase', color: 'var(--ck-signal-cool)',
                  fontFamily: 'var(--ck-font-mono)' }}>{s.h}</h2>
                {s.body.map((b, j) => (
                  <p key={j} style={{ margin: '0 0 14px', fontSize: 15.5, lineHeight: 1.7, textWrap: 'pretty',
                    color: 'var(--ck-fg-1)',
                    background: b.src && b.src === sel ? `color-mix(in oklab, ${TINT[DOCS[VIEWS[b.src].docId].tint]} 9%, transparent)` : 'transparent',
                    borderRadius: 'var(--ck-radius-sm)', padding: b.src && b.src === sel ? '4px 8px' : '0',
                    margin: b.src && b.src === sel ? '0 -8px 14px' : '0 0 14px',
                    transition: 'background var(--ck-dur-med)' }}>
                    {b.t}
                    {b.src
                      ? <SourceMark n={numOf(b.src)} view={VIEWS[b.src]} active={b.src === sel} onClick={() => setSel(b.src)} />
                      : <span style={{ marginLeft: 5, fontFamily: 'var(--ck-font-mono)', fontSize: 9.5,
                          color: 'var(--ck-fg-5)', verticalAlign: 'super' }}>(synthèse)</span>}
                  </p>
                ))}
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* inspecteur de provenance */}
      <div style={{ display: 'flex', flexDirection: 'column', background: 'var(--ck-bg-panel)', minWidth: 0 }}>
        <div style={{ flex: 'none', padding: '16px 18px', borderBottom: '1px solid var(--ck-stroke-2)',
          display: 'flex', alignItems: 'center', gap: 8 }}>
          <Icon name="eye" size={15} style={{ color: 'var(--ck-fg-3)' }} />
          <Label>Source & provenance</Label>
        </div>

        {selView ? (
          <div className="ck-scroll" style={{ flex: 1, overflowY: 'auto', padding: 18, display: 'flex',
            flexDirection: 'column', gap: 16 }}>
            {/* vue pointée avec zone surlignée */}
            <div style={{ position: 'relative' }}>
              <ViewTile view={selView} size="xl" active />
              {/* zone "pointée" surlignée */}
              <div style={{ position: 'absolute', top: '26%', left: '14%', width: '46%', height: '34%',
                border: `2px solid ${tint}`, borderRadius: 4, boxShadow: `0 0 0 9999px color-mix(in oklab, var(--ck-bg-void) 38%, transparent)`,
                pointerEvents: 'none' }}>
                <span style={{ position: 'absolute', top: -9, left: -1, padding: '1px 7px', borderRadius: 3,
                  background: tint, color: 'var(--ck-on-signal)', fontFamily: 'var(--ck-font-mono)',
                  fontSize: 8.5, fontWeight: 700, whiteSpace: 'nowrap' }}>ZONE POINTÉE</span>
              </div>
            </div>

            {/* méta source */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <Icon name={selDoc.kind === 'image' ? 'image' : 'doc'} size={14} style={{ color: tint }} />
                <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 12, color: 'var(--ck-fg-1)' }}>{selDoc.name}</span>
              </div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                <Pill k="Vue">{selDoc.kind === 'image' ? 'cliché ' + selView.page : 'page ' + selView.page}</Pill>
                <Pill k="Objet">{selView.label}</Pill>
                <Pill k="Index" tint={selIndexed ? 'var(--ck-signal-pos)' : 'var(--ck-signal-cool)'}>
                  {selIndexed ? 'indexé' : 'référencé'}
                </Pill>
              </div>
            </div>

            {/* retour à l'instant du transcript */}
            <button style={{ appearance: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10,
              padding: '11px 13px', borderRadius: 'var(--ck-radius-md)', textAlign: 'left',
              border: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-inset)', color: 'var(--ck-fg-2)' }}>
              <Icon name="undo" size={15} style={{ color: 'var(--ck-signal-cool)' }} />
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, color: 'var(--ck-fg-1)' }}>Revoir l'instant capté</div>
                <div style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10, color: 'var(--ck-fg-4)', marginTop: 2 }}>
                  dit à {SRC_MOMENT[sel] || '—'} dans Le Fil
                </div>
              </div>
              <Icon name="arrow" size={14} />
            </button>

            <p style={{ margin: 0, fontSize: 11.5, lineHeight: 1.5, color: 'var(--ck-fg-4)' }}>
              Provenance bidirectionnelle : du rapport vers la pièce <i>et</i> vers le moment exact de la séance où
              l'expert l'a pointée.
            </p>
          </div>
        ) : (
          <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: 'var(--ck-fg-5)', fontSize: 12.5 }}>
            Cliquez une source dans le rapport
          </div>
        )}
      </div>
    </div>
  );
}

function Pill({ k, children, tint }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 9px',
      borderRadius: 999, border: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-inset)' }}>
      <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 8.5, letterSpacing: '0.1em',
        textTransform: 'uppercase', color: 'var(--ck-fg-5)' }}>{k}</span>
      <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10.5, color: tint || 'var(--ck-fg-2)', fontWeight: 600 }}>{children}</span>
    </span>
  );
}

Object.assign(window, { ReportScreen });

</script>

<script type="text/babel" data-src="doc.jsx">
// doc.jsx — la contre-proposition écrite (mode DOC). Document cockpit lisible,
// avec liens "→ Voir dans le prototype" qui basculent vers PROTO.
const { useState: dS } = React;

function Kicker({ children }) {
  return <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10.5, letterSpacing: '0.16em',
    textTransform: 'uppercase', color: 'var(--ck-signal-cool)' }}>{children}</span>;
}

function DocSection({ n, title, children }) {
  return (
    <section style={{ marginBottom: 56, scrollMarginTop: 24 }} id={'sec-' + n}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, marginBottom: 18,
        paddingBottom: 12, borderBottom: '1px solid var(--ck-stroke-2)' }}>
        <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 13, color: 'var(--ck-fg-5)',
          fontWeight: 700 }}>{String(n).padStart(2, '0')}</span>
        <h2 style={{ margin: 0, fontSize: 22, fontWeight: 680, color: 'var(--ck-fg-1)',
          letterSpacing: '-0.01em' }}>{title}</h2>
      </div>
      {children}
    </section>
  );
}

function P({ children, style }) {
  return <p style={{ margin: '0 0 14px', fontSize: 14.5, lineHeight: 1.68, textWrap: 'pretty',
    color: 'var(--ck-fg-2)', ...style }}>{children}</p>;
}
function B({ children }) { return <b style={{ color: 'var(--ck-fg-1)', fontWeight: 650 }}>{children}</b>; }

function Goto({ onGoto, to, children }) {
  return (
    <span style={{ display: 'inline-block', margin: '4px 0' }}>
      <Btn size="sm" variant="ghost" icon="arrow" onClick={() => onGoto(to)}>{children}</Btn>
    </span>
  );
}

// item d'analyse (verdict coloré)
function Verdict({ kind, label, children }) {
  const map = { keep: ['pos', 'On garde'], weak: ['warn', 'Faible'], risk: ['neg', 'Risqué'], cut: ['neutral', 'Superflu'] };
  const [dot, def] = map[kind];
  return (
    <div style={{ display: 'flex', gap: 12, padding: '13px 15px', borderRadius: 'var(--ck-radius-md)',
      border: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)', marginBottom: 9 }}>
      <div style={{ flex: 'none', display: 'flex', alignItems: 'center', gap: 7, width: 104 }}>
        <Dot kind={dot} /><span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 10,
          letterSpacing: '0.08em', textTransform: 'uppercase', color: `var(--ck-signal-${dot === 'neutral' ? 'cool' : dot})`,
          fontWeight: 700 }}>{label || def}</span>
      </div>
      <div style={{ flex: 1, fontSize: 13.5, lineHeight: 1.55, color: 'var(--ck-fg-2)' }}>{children}</div>
    </div>
  );
}

function Callout({ icon = 'spark', kind = 'violet', title, children }) {
  return (
    <div style={{ display: 'flex', gap: 13, padding: '15px 17px', borderRadius: 'var(--ck-radius-lg)',
      border: `1px solid var(--ck-signal-${kind})44`, background: `color-mix(in oklab, var(--ck-signal-${kind}) 7%, var(--ck-bg-panel))`,
      margin: '6px 0 18px' }}>
      <Icon name={icon} size={18} style={{ color: `var(--ck-signal-${kind})`, marginTop: 1, flex: 'none' }} />
      <div>
        {title && <div style={{ fontSize: 13.5, fontWeight: 650, color: 'var(--ck-fg-1)', marginBottom: 4 }}>{title}</div>}
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color: 'var(--ck-fg-2)' }}>{children}</div>
      </div>
    </div>
  );
}

// mini diagramme de flux (boîtes + flèches, formes simples)
function FlowStep({ icon, label }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7, flex: 1, minWidth: 78 }}>
      <div style={{ width: 42, height: 42, borderRadius: 'var(--ck-radius-md)', display: 'grid', placeItems: 'center',
        border: '1px solid var(--ck-stroke-3)', background: 'var(--ck-bg-inset)', color: 'var(--ck-signal-cool)' }}>
        <Icon name={icon} size={18} />
      </div>
      <span style={{ fontSize: 11, color: 'var(--ck-fg-2)', textAlign: 'center', lineHeight: 1.3 }}>{label}</span>
    </div>
  );
}
function FlowArrow() {
  return <Icon name="arrow" size={15} style={{ color: 'var(--ck-fg-5)', flex: 'none', marginTop: 13 }} />;
}

// composant du DS (carte)
function DSItem({ name, role, states }) {
  return (
    <div style={{ padding: '13px 15px', borderRadius: 'var(--ck-radius-md)', border: '1px solid var(--ck-stroke-2)',
      background: 'var(--ck-bg-panel)' }}>
      <div style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 12, color: 'var(--ck-fg-1)', fontWeight: 600 }}>{name}</div>
      <div style={{ fontSize: 12.5, lineHeight: 1.45, color: 'var(--ck-fg-3)', margin: '5px 0 8px' }}>{role}</div>
      {states && <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
        {states.map((s, i) => <span key={i} style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5,
          padding: '2px 7px', borderRadius: 999, border: '1px solid var(--ck-stroke-2)', color: 'var(--ck-fg-4)' }}>{s}</span>)}
      </div>}
    </div>
  );
}

}

const cd = { fontFamily: 'var(--ck-font-mono)', fontSize: 12, padding: '1px 6px', borderRadius: 4,
  background: 'var(--ck-bg-inset)', border: '1px solid var(--ck-stroke-2)', color: 'var(--ck-fg-2)' };

function Trade({ ecart, why, tradeoff }) {
  return (
    <div style={{ padding: '14px 16px', borderRadius: 'var(--ck-radius-md)', border: '1px solid var(--ck-stroke-2)',
      background: 'var(--ck-bg-panel)', marginBottom: 10 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
        <Icon name="flow" size={15} style={{ color: 'var(--ck-signal-cool)' }} />
        <span style={{ fontSize: 13.5, fontWeight: 650, color: 'var(--ck-fg-1)' }}>{ecart}</span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div><Label style={{ color: 'var(--ck-signal-pos)' }}>Pourquoi</Label>
          <p style={{ margin: '5px 0 0', fontSize: 12.5, lineHeight: 1.5, color: 'var(--ck-fg-2)' }}>{why}</p></div>
        <div><Label style={{ color: 'var(--ck-signal-warn)' }}>Trade-off</Label>
          <p style={{ margin: '5px 0 0', fontSize: 12.5, lineHeight: 1.5, color: 'var(--ck-fg-3)' }}>{tradeoff}</p></div>
      </div>
    </div>
  );
}

Object.assign(window, { DocMode });

</script>

<script type="text/babel" data-src="app.jsx">
// app.jsx — coquille : navigation DOC ⇄ PROTO, sous-onglets d'écrans, Tweaks.
const { useState: aS, useEffect: aE } = React;

const SCREENS = [
  { id: 'capture', label: 'Capture', icon: 'mic' },
  { id: 'pieces', label: 'Pièces & pointage', icon: 'layers' },
  { id: 'fin', label: 'Fin de séance', icon: 'check' },
  { id: 'index', label: 'Indexation', icon: 'spark' },
  { id: 'report', label: 'Rapport', icon: 'book' },
  { id: 'edge', label: 'Cas limites', icon: 'target' },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "sombre",
  "pointing": "hybride",
  "oracle": true,
  "density": "regular",
  "speed": 1.2
}/*EDITMODE-END*/;

function NavTab({ active, onClick, icon, children, compact }) {
  const [h, setH] = aS(false);
  return (
    <button onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ appearance: 'none', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 7,
        padding: compact ? '6px 10px' : '7px 13px', borderRadius: 'var(--ck-radius-md)', border: 'none',
        fontFamily: 'var(--ck-font-sans)', fontSize: 12.5, fontWeight: active ? 650 : 520,
        background: active ? 'var(--ck-bg-panel-hi)' : (h ? 'var(--ck-tint-faint)' : 'transparent'),
        color: active ? 'var(--ck-fg-1)' : 'var(--ck-fg-3)', whiteSpace: 'nowrap',
        boxShadow: active ? 'inset 0 0 0 1px var(--ck-stroke-2)' : 'none' }}>
      {icon && <Icon name={icon} size={14} style={{ color: active ? 'var(--ck-signal-cool)' : 'inherit' }} />}
      {children}
    </button>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [mode, setMode] = aS('doc');          // 'doc' | 'proto'
  const [screen, setScreen] = aS('capture');
  const [offline, setOffline] = aS(false);

  // thème global
  aE(() => {
    const root = document.documentElement;
    if (t.theme === 'sombre') { root.classList.add('dark'); root.setAttribute('data-theme', 'dark'); }
    else { root.classList.remove('dark'); root.setAttribute('data-theme', 'light'); }
  }, [t.theme]);

  const goto = (target) => {
    if (target === 'doc') { setMode('doc'); return; }
    setMode('proto'); setScreen(target);
  };

  const tweaks = { pointing: t.pointing, oracle: t.oracle, density: t.density, speed: t.speed };

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
      fontFamily: 'var(--ck-font-sans)', background: 'var(--ck-bg-base)' }}>
      {/* barre supérieure */}
      <header style={{ height: 52, flex: 'none', display: 'flex', alignItems: 'center', gap: 16,
        padding: '0 16px', borderBottom: '1px solid var(--ck-stroke-2)', background: 'var(--ck-bg-panel)',
        zIndex: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
          <span style={{ width: 22, height: 22, borderRadius: 6, display: 'grid', placeItems: 'center',
            background: 'linear-gradient(135deg, var(--ck-signal-cool), var(--ck-signal-violet))',
            color: 'var(--ck-bg-void)' }}><Icon name="target" size={14} /></span>
          <span style={{ fontSize: 13.5, fontWeight: 700, color: 'var(--ck-fg-1)', letterSpacing: '-0.01em' }}>Le Fil</span>
          <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5, color: 'var(--ck-fg-5)',
            padding: '2px 6px', border: '1px solid var(--ck-stroke-2)', borderRadius: 999 }}>contre-proposition</span>
        </div>

        {/* bascule DOC / PROTO */}
        <div style={{ display: 'flex', gap: 2, padding: 2, borderRadius: 'var(--ck-radius-md)',
          background: 'var(--ck-bg-void)', border: '1px solid var(--ck-stroke-2)' }}>
          <NavTab active={mode === 'doc'} onClick={() => setMode('doc')} icon="text" compact>Doc</NavTab>
          <NavTab active={mode === 'proto'} onClick={() => setMode('proto')} icon="eye" compact>Prototype</NavTab>
        </div>

        {/* sous-onglets prototype */}
        {mode === 'proto' && (
          <div className="ck-scroll" style={{ display: 'flex', gap: 2, overflowX: 'auto', flex: 1 }}>
            {SCREENS.map((s) => (
              <NavTab key={s.id} active={screen === s.id} onClick={() => setScreen(s.id)} icon={s.icon} compact>
                {s.label}
              </NavTab>
            ))}
          </div>
        )}

        {mode === 'doc' && (
          <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontFamily: 'var(--ck-font-mono)', fontSize: 9.5, color: 'var(--ck-fg-5)' }}>
              ⚙ Tweaks : pointage · oracle · densité · thème
            </span>
          </span>
        )}
      </header>

      {/* corps */}
      <main style={{ flex: 1, position: 'relative', minHeight: 0 }}>
        {mode === 'doc' && <DocMode onGoto={goto} />}
        {mode === 'proto' && screen === 'capture' && (
          <CaptureScreen tweaks={tweaks} onFinish={() => setScreen('fin')}
            offline={offline} onToggleOffline={() => setOffline((o) => !o)} />
        )}
        {mode === 'proto' && screen === 'pieces' && <PiecesScreen />}
        {mode === 'proto' && screen === 'fin' && <FinScreen onOpenReport={() => setScreen('report')} />}
        {mode === 'proto' && screen === 'index' && <IndexScreen />}
        {mode === 'proto' && screen === 'report' && <ReportScreen />}
        {mode === 'proto' && screen === 'edge' && <EdgeScreen />}
      </main>

      {/* Tweaks */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Pointage déictique" />
        <TweakRadio label="Mode" value={t.pointing}
          options={[{ value: 'auto', label: 'Auto' }, { value: 'hybride', label: 'Hybride' }, { value: 'manuel', label: 'Manuel' }]}
          onChange={(v) => setTweak('pointing', v)} />
        <TweakSection label="Capture" />
        <TweakToggle label="Oracle actif" value={t.oracle} onChange={(v) => setTweak('oracle', v)} />
        <TweakRadio label="Densité du Fil" value={t.density}
          options={['compact', 'regular', 'comfy']} onChange={(v) => setTweak('density', v)} />
        <TweakSlider label="Vitesse simu" value={t.speed} min={0.5} max={2.5} step={0.1} unit="×"
          onChange={(v) => setTweak('speed', v)} />
        <TweakSection label="Apparence" />
        <TweakRadio label="Thème" value={t.theme}
          options={[{ value: 'sombre', label: 'Sombre' }, { value: 'clair', label: 'Clair' }]}
          onChange={(v) => setTweak('theme', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
