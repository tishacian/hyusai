/* ============================================
   AGENTIUM — Design Tokens
   Operating System for Intelligence
   ============================================ */

:root {
  /* — SURFACE — */
  --bg-void:       #05070a;    /* the abyss behind everything */
  --bg-base:       #07090c;    /* app background */
  --bg-panel:      #0c1014;    /* raised surface */
  --bg-panel-hi:   #11161c;    /* elevated surface */
  --bg-inset:      #0a0d11;    /* recessed */
  --bg-code:       #050709;    /* terminal / trace */

  /* — STROKE — */
  --stroke-1:      rgba(255,255,255,0.04);
  --stroke-2:      rgba(255,255,255,0.08);
  --stroke-3:      rgba(255,255,255,0.14);
  --stroke-hot:    rgba(125,211,252,0.28);

  /* — TEXT — */
  --fg-1:          #f2f5f8;    /* headline */
  --fg-2:          #c8cdd4;    /* body */
  --fg-3:          #8891a0;    /* secondary */
  --fg-4:          #5a6270;    /* tertiary */
  --fg-5:          #3a4049;    /* muted */

  /* — SIGNAL — */
  --signal-pos:    #34d399;    /* value, confidence, success */
  --signal-neg:    #ef5a6f;    /* risk, anomaly */
  --signal-warn:   #f5b84a;    /* attention */
  --signal-cool:   #7dd3fc;    /* system / steering / primary */
  --signal-violet: #a78bfa;    /* intelligence / ai */
  --signal-ice:    #e0f2fe;    /* high-emphasis cool */

  /* glow halos */
  --glow-cool:     0 0 24px rgba(125,211,252,0.28);
  --glow-pos:      0 0 24px rgba(52,211,153,0.22);
  --glow-violet:   0 0 24px rgba(167,139,250,0.25);

  /* — TYPE — */
  --font-sans: "Inter Tight", "Söhne", -apple-system, "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* — GRID / SPACE — */
  --u: 4px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-xl: 14px;

  /* — MOTION — */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 120ms;
  --dur-med: 240ms;
  --dur-slow: 520ms;
}

/* Light variant */
[data-theme="light"] {
  --bg-void:       #e8e6df;
  --bg-base:       #f4f2eb;
  --bg-panel:      #fafaf6;
  --bg-panel-hi:   #ffffff;
  --bg-inset:      #efede6;
  --bg-code:       #1a1c20;

  --stroke-1:      rgba(0,0,0,0.06);
  --stroke-2:      rgba(0,0,0,0.10);
  --stroke-3:      rgba(0,0,0,0.18);
  --stroke-hot:    rgba(14,116,144,0.35);

  --fg-1:          #0a0c10;
  --fg-2:          #2a2f36;
  --fg-3:          #5c6370;
  --fg-4:          #8a909a;
  --fg-5:          #b8bcc3;

  --signal-pos:    #0e9f6e;
  --signal-neg:    #d93a52;
  --signal-warn:   #c27803;
  --signal-cool:   #0e7490;
  --signal-violet: #7c3aed;
  --signal-ice:    #0c4a6e;

  --glow-cool:     0 0 0 transparent;
  --glow-pos:      0 0 0 transparent;
  --glow-violet:   0 0 0 transparent;
}

/* ============================================
   RESET / BASE
   ============================================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-feature-settings: "ss01", "cv11", "tnum";
  background: var(--bg-base);
  color: var(--fg-2);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}
::selection { background: var(--signal-cool); color: var(--bg-base); }

.mono { font-family: var(--font-mono); font-feature-settings: "tnum", "zero"; }
.tnum { font-variant-numeric: tabular-nums; }

button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }

/* Scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--stroke-2); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--stroke-3); background-clip: padding-box; border: 2px solid transparent; }

/* Utility */
.hairline { background: var(--stroke-2); }
.hairline-v { width: 1px; background: var(--stroke-2); }
.hairline-h { height: 1px; background: var(--stroke-2); }

/* Ambient live pulse */
@keyframes live-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--signal-pos);
  box-shadow: 0 0 8px var(--signal-pos);
  animation: live-pulse 1.6s var(--ease-in-out) infinite;
  display: inline-block;
}
.live-dot.cool { background: var(--signal-cool); box-shadow: 0 0 8px var(--signal-cool); }
.live-dot.violet { background: var(--signal-violet); box-shadow: 0 0 8px var(--signal-violet); }
.live-dot.warn { background: var(--signal-warn); box-shadow: 0 0 8px var(--signal-warn); }

@keyframes stream-shift {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}
@keyframes grid-drift {
  0% { background-position: 0 0; }
  100% { background-position: 48px 48px; }
}

/* Reactive motion-reduce respects brand word "alive" but not annoying */
@media (prefers-reduced-motion: reduce) {
  .live-dot { animation: none; }
}

/* ============================================
   AGENTIUM — Concept Overlays
   A: Instrument Panel (default tokens)
   B: Living Organism (glows, curves, ambient pulse)
   C: Architectural (monochrome, editorial, sharper)
   D: Spatial OS (radical — deeper black, neon grid)
   ============================================ */

/* — Concept A is the baseline (tokens.css) — */

/* — Concept B: LIVING ORGANISM — softer, glowy, biological — */
[data-concept="B"] {
  --bg-base:    #080a12;
  --bg-panel:   #0d1120;
  --bg-panel-hi:#121728;
  --bg-inset:   #0a0d18;
  --signal-cool: #a78bfa;
  --signal-violet: #f0abfc;
  --signal-pos: #22d3ee;
  --stroke-hot: rgba(167,139,250,0.35);
  --radius-md: 14px;
  --radius-lg: 18px;
}
[data-concept="B"] body { background: radial-gradient(ellipse at 30% 20%, #12152a, var(--bg-base) 60%); }
[data-concept="B"] .live-dot { box-shadow: 0 0 14px currentColor, 0 0 30px currentColor; }

/* — Concept C: ARCHITECTURAL — editorial, sharp, monochrome — */
[data-concept="C"] {
  --bg-base:    #0a0a0a;
  --bg-panel:   #111111;
  --bg-panel-hi:#161616;
  --bg-inset:   #0d0d0d;
  --signal-cool: #ffffff;
  --signal-violet: #d4d4d4;
  --signal-pos: #a3e635;
  --signal-neg: #ff4500;
  --stroke-1: rgba(255,255,255,0.06);
  --stroke-2: rgba(255,255,255,0.12);
  --stroke-3: rgba(255,255,255,0.22);
  --radius-md: 0px;
  --radius-lg: 0px;
  --radius-sm: 0px;
  --radius-xl: 0px;
  --glow-cool: none;
}
[data-concept="C"] .mono { letter-spacing: 0.06em !important; }

/* — Concept D: SPATIAL OS — radical, deep black, phosphor green grid — */
[data-concept="D"] {
  --bg-base:    #020307;
  --bg-panel:   #05080d;
  --bg-panel-hi:#0a0f14;
  --bg-inset:   #030609;
  --signal-cool: #7dd3fc;
  --signal-violet: #c4f542;
  --signal-pos: #c4f542;
  --stroke-1: rgba(196,245,66,0.06);
  --stroke-2: rgba(196,245,66,0.12);
  --stroke-3: rgba(196,245,66,0.22);
  --stroke-hot: rgba(196,245,66,0.45);
  --glow-cool: 0 0 28px rgba(196,245,66,0.35);
  --glow-pos:  0 0 28px rgba(196,245,66,0.35);
}
[data-concept="D"] body { background:
  radial-gradient(circle at 20% 30%, rgba(196,245,66,0.04), transparent 50%),
  radial-gradient(circle at 80% 70%, rgba(125,211,252,0.04), transparent 50%),
  var(--bg-base);
}

// ===== primitives.jsx =====
// ============================================
// AGENTIUM — Shared primitives
// ============================================

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

// ---------- Live number hook (reactive telemetry) ----------
function useLiveNumber(base, { jitter = 0.02, interval = 1400, enabled = true } = {}) {
  const [v, setV] = useState(base);
  useEffect(() => {
    setV(base);
    if (!enabled) return;
    const t = setInterval(() => {
      const delta = (Math.random() - 0.5) * 2 * jitter * base;
      setV(base + delta);
    }, interval);
    return () => clearInterval(t);
  }, [base, jitter, interval, enabled]);
  return v;
}

// ---------- Formatters ----------
const fmt = {
  money: (n) => {
    const abs = Math.abs(n);
    if (abs >= 1e9) return `${(n/1e9).toFixed(2)}B`;
    if (abs >= 1e6) return `${(n/1e6).toFixed(2)}M`;
    if (abs >= 1e3) return `${(n/1e3).toFixed(1)}k`;
    return `${n.toFixed(2)}`;
  },
  pct: (n, d=1) => `${n >= 0 ? '+' : ''}${n.toFixed(d)}%`,
  num: (n, d=0) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }),
  ms: (n) => n < 1000 ? `${Math.round(n)}ms` : `${(n/1000).toFixed(2)}s`,
};

// ---------- Sparkline ----------
function Spark({ data, color = 'var(--signal-cool)', height = 28, width = 120, glow = true, fill = true }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const step = width / (data.length - 1);
  const pts = data.map((v, i) => `${i * step},${height - ((v - min) / range) * height}`).join(' ');
  const fillPts = `0,${height} ${pts} ${width},${height}`;
  const gid = useRef(`g-${Math.random().toString(36).slice(2,8)}`).current;
  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {fill && <polygon points={fillPts} fill={`url(#${gid})`} />}
      <polyline
        points={pts}
        fill="none"
        stroke={color}
        strokeWidth="1.25"
        strokeLinecap="round"
        strokeLinejoin="round"
        style={glow ? { filter: `drop-shadow(0 0 4px ${color})` } : undefined}
      />
    </svg>
  );
}

// ---------- Bar (tiny, tabular) ----------
function MicroBar({ value, max = 100, color = 'var(--signal-cool)', w = 80, h = 4 }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return (
    <div style={{ width: w, height: h, background: 'var(--stroke-1)', borderRadius: 2, overflow: 'hidden' }}>
      <div style={{ width: `${pct}%`, height: '100%', background: color, boxShadow: `0 0 8px ${color}` }} />
    </div>
  );
}

// ---------- Glyphs (minimal, line-based) ----------
const Glyph = {
  Flow: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="3" cy="3" r="1.5" stroke="currentColor"/><circle cx="11" cy="11" r="1.5" stroke="currentColor"/><path d="M4.5 3.5 L11 11" stroke="currentColor" strokeLinecap="round"/></svg>,
  Pulse: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7 L4 7 L5.5 3 L7.5 11 L9 7 L13 7" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Cube: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 L12 3.5 V10.5 L7 13 L2 10.5 V3.5 Z M7 1 V7 M2 3.5 L7 7 L12 3.5" stroke="currentColor" strokeLinejoin="round"/></svg>,
  Sliders: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 1 V13 M11 1 V13 M3 5 L1 5 M3 5 L5 5 M11 9 L9 9 M11 9 L13 9" stroke="currentColor" strokeLinecap="round"/></svg>,
  Focus: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 4 V1 H4 M10 1 H13 V4 M13 10 V13 H10 M4 13 H1 V10" stroke="currentColor" strokeLinecap="round"/><circle cx="7" cy="7" r="2" stroke="currentColor"/></svg>,
  Bolt: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7.5 1 L3 8 H7 L6.5 13 L11 6 H7 Z" stroke="currentColor" strokeLinejoin="round"/></svg>,
  Arrow: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7 H11 M7.5 3.5 L11 7 L7.5 10.5" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Ledger: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2 H12 V12 H2 Z M2 5 H12 M5 2 V12" stroke="currentColor"/></svg>,
  Telemetry: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 12 L4 8 L6 10 L9 4 L13 7" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/><circle cx="13" cy="7" r="1.2" fill="currentColor"/></svg>,
  Warn: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 L13 12 H1 Z M7 5 V8 M7 10 V10.5" stroke="currentColor" strokeLinejoin="round"/></svg>,
  Check: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7 L6 11 L12 3" stroke="currentColor" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  X: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" strokeLinecap="round"/></svg>,
  ZoomIn: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="currentColor"/><path d="M6 4 V8 M4 6 H8 M9 9 L12.5 12.5" stroke="currentColor" strokeLinecap="round"/></svg>,
  ZoomOut: () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="currentColor"/><path d="M4 6 H8 M9 9 L12.5 12.5" stroke="currentColor" strokeLinecap="round"/></svg>,
};

// ---------- Tag / Pill ----------
function Tag({ children, tone = 'neutral', style }) {
  const tones = {
    neutral: { bg: 'var(--stroke-1)', fg: 'var(--fg-3)', bd: 'var(--stroke-2)' },
    pos:     { bg: 'rgba(52,211,153,0.10)', fg: 'var(--signal-pos)', bd: 'rgba(52,211,153,0.25)' },
    neg:     { bg: 'rgba(239,90,111,0.10)', fg: 'var(--signal-neg)', bd: 'rgba(239,90,111,0.25)' },
    cool:    { bg: 'rgba(125,211,252,0.08)', fg: 'var(--signal-cool)', bd: 'rgba(125,211,252,0.25)' },
    violet:  { bg: 'rgba(167,139,250,0.10)', fg: 'var(--signal-violet)', bd: 'rgba(167,139,250,0.28)' },
    warn:    { bg: 'rgba(245,184,74,0.08)', fg: 'var(--signal-warn)', bd: 'rgba(245,184,74,0.25)' },
  };
  const t = tones[tone];
  return (
    <span className="mono" style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      padding: '2px 6px', borderRadius: 3,
      fontSize: 10, letterSpacing: '0.04em', textTransform: 'uppercase',
      background: t.bg, color: t.fg, border: `1px solid ${t.bd}`,
      whiteSpace: 'nowrap',
      ...style
    }}>{children}</span>
  );
}

// ---------- KeyCap ----------
function Kbd({ children }) {
  return <span className="mono" style={{
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    minWidth: 16, height: 16, padding: '0 4px',
    fontSize: 10, color: 'var(--fg-3)',
    background: 'var(--stroke-1)', border: '1px solid var(--stroke-2)',
    borderRadius: 3,
  }}>{children}</span>;
}

// Export to window
Object.assign(window, { useLiveNumber, fmt, Spark, MicroBar, Glyph, Tag, Kbd });


// ===== chrome.jsx =====
// ============================================
// AGENTIUM — Chrome & Semantic Zoom Navigator
// ============================================

const ZOOM_LEVELS = [
  { id: 'portfolio', label: 'Portfolio', sub: 'All capabilities' },
  { id: 'capability', label: 'Capability', sub: 'Customer Intelligence' },
  { id: 'system',     label: 'System',     sub: 'Sentiment Routing v4.2' },
  { id: 'skill',      label: 'Skill',      sub: 'Semantic Extraction' },
  { id: 'run',        label: 'Run',        sub: 'RUN-8924A' },
];

const VIEWS = [
  { id: 'hypervisor', label: 'Hypervisor',     glyph: 'Ledger',   desc: 'Executive cockpit' },
  { id: 'zoom',       label: 'Zoom',           glyph: 'Focus',    desc: 'Semantic navigator' },
  { id: 'steering',   label: 'Steering',       glyph: 'Sliders',  desc: 'Control plane' },
  { id: 'builder',    label: 'Builder',        glyph: 'Flow',     desc: 'System canvas' },
  { id: 'run',        label: 'Run',            glyph: 'Telemetry',desc: 'Execution detail' },
];

// ---------- Title bar ----------
function TitleBar({ view, setView, systemState }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'stretch',
      height: 48,
      borderBottom: '1px solid var(--stroke-2)',
      background: 'var(--bg-base)',
      position: 'relative', zIndex: 10,
    }}>
      {/* Brand */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '0 18px', minWidth: 240,
        borderRight: '1px solid var(--stroke-2)',
      }}>
        <BrandMark />
        <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: 'var(--fg-1)', letterSpacing: '-0.01em' }}>Agentium</span>
          <span className="mono" style={{ fontSize: 9, color: 'var(--fg-4)', marginTop: 3, letterSpacing: '0.08em', textTransform: 'uppercase' }}>OS / v4.2.1</span>
        </div>
      </div>

      {/* Zoom breadcrumb */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 2, padding: '0 14px', flex: 1, overflow: 'hidden' }}>
        {ZOOM_LEVELS.map((lv, i) => (
          <React.Fragment key={lv.id}>
            <button style={{
              display: 'flex', flexDirection: 'column', alignItems: 'flex-start',
              padding: '6px 10px', border: 'none', background: 'transparent',
              color: i === 2 ? 'var(--fg-1)' : 'var(--fg-4)',

            }}>
              <span className="mono" style={{
                fontSize: 9, letterSpacing: '0.1em', textTransform: 'uppercase',
                color: i === 2 ? 'var(--signal-cool)' : 'var(--fg-5)',
              }}>{lv.label}</span>
              <span style={{ fontSize: 12, marginTop: 2, whiteSpace: 'nowrap', fontWeight: i === 2 ? 500 : 400 }}>{lv.sub}</span>
            </button>
            {i < ZOOM_LEVELS.length - 1 && (
              <span style={{ color: 'var(--fg-5)', fontSize: 10 }}>›</span>
            )}
          </React.Fragment>
        ))}
      </div>

      {/* System status */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 18, padding: '0 18px', borderLeft: '1px solid var(--stroke-2)' }}>
        <StatusReadout label="THRPT" value={`${systemState.throughput.toFixed(1)}k/s`} color="var(--signal-cool)" />
        <StatusReadout label="LATENCY" value={`${Math.round(systemState.latency)}ms`} color="var(--signal-violet)" />
        <StatusReadout label="YIELD" value={`+${systemState.yield.toFixed(1)}%`} color="var(--signal-pos)" />
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, paddingLeft: 14, borderLeft: '1px solid var(--stroke-2)' }}>
          <span className="live-dot" />
          <span className="mono" style={{ fontSize: 10, color: 'var(--fg-3)', letterSpacing: '0.08em' }}>LIVE</span>
        </div>
      </div>
    </div>
  );
}

function StatusReadout({ label, value, color }) {

// Value curve — the hero visualization
function ValueCurve({ height = 120 }) {
  const width = 900;
  const { valuePts, costPts, netPts } = useMemo(() => {
    const N = 90;
    const valueArr = [], costArr = [], netArr = [];
    let v = 3, c = 2;
    for (let i = 0; i < N; i++) {
      v += 0.12 + Math.sin(i/6) * 0.08 + (Math.random() - 0.3) * 0.15;
      c += 0.03 + Math.sin(i/9) * 0.02 + (Math.random() - 0.5) * 0.05;
      valueArr.push(v); costArr.push(c); netArr.push(v - c);
    }
    const step = width / (N - 1);
    const max = Math.max(...valueArr) * 1.05;
    const toPts = (arr) => arr.map((val, i) => `${i*step},${height - (val/max)*height}`).join(' ');
    return { valuePts: toPts(valueArr), costPts: toPts(costArr), netPts: toPts(netArr) };
  }, [height]);

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ display: 'block' }}>
      <defs>
        <linearGradient id="vcg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--signal-cool)" stopOpacity="0.18" />
          <stop offset="100%" stopColor="var(--signal-cool)" stopOpacity="0" />
        </linearGradient>
        <linearGradient id="netg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--signal-pos)" stopOpacity="0.16" />
          <stop offset="100%" stopColor="var(--signal-pos)" stopOpacity="0" />
        </linearGradient>
      </defs>
      {/* grid */}
      {[0, 0.25, 0.5, 0.75, 1].map(p => (
        <line key={p} x1="0" x2={width} y1={height*p} y2={height*p} stroke="var(--stroke-1)" strokeWidth="1" />
      ))}
      {/* today marker */}
      <line x1={width*0.7} x2={width*0.7} y1="0" y2={height} stroke="var(--signal-cool)" strokeWidth="0.8" strokeDasharray="2 3" opacity="0.5" />
      <text x={width*0.7 + 4} y="12" fill="var(--signal-cool)" fontSize="9" fontFamily="var(--font-mono)" letterSpacing="0.1em">TODAY</text>

      <polygon points={`0,${height} ${valuePts} ${width},${height}`} fill="url(#vcg)" />
      <polygon points={`0,${height} ${netPts} ${width},${height}`} fill="url(#netg)" />
      <polyline points={costPts} fill="none" stroke="var(--signal-violet)" strokeWidth="1.2" strokeDasharray="3 3" opacity="0.7" />
      <polyline points={valuePts} fill="none" stroke="var(--signal-cool)" strokeWidth="1.6" style={{ filter: 'drop-shadow(0 0 4px var(--signal-cool))' }}/>
      <polyline points={netPts} fill="none" stroke="var(--signal-pos)" strokeWidth="1.6" style={{ filter: 'drop-shadow(0 0 4px var(--signal-pos))' }}/>
    </svg>
  );
}

// AGENTIUM — Steering Cockpit (Control Plane)
// Three variants of the same control surface:

//  B. Radial dials (aircraft cockpit)
//  C. 2D tradeoff space (direct manipulation)
// ============================================

function SteeringView() {
  const [variant, setVariant] = useState('A');
  const [params, setParams] = useState({
    resource: 0.65,     // 0 = lean, 1 = deep
    velocity: 0.82,     // 0 = thorough, 1 = rapid
    autonomy: 0.30,     // 0 = HITL, 1 = full autonomy
  });

  // Baseline values; deltas react live to params
  const baseline = { roi: 482, cost: 2.94, risk: 0.12, latency: 420 };
  const projected = useMemo(() => {
    const r = params.resource, v = params.velocity, a = params.autonomy;
    // Simple deterministic model — enough to feel alive
    const roiDelta = (r - 0.5)*8 + (a - 0.3)*6 - (v - 0.5)*2;
    const costDelta = (r - 0.5)*14 + (a - 0.3)*(-8) + (v - 0.5)*(-6);
    const riskDelta = (a - 0.3)*0.18 + (v - 0.5)*0.08 - (r - 0.5)*0.04;
    const latDelta = (v - 0.5)*(-180) + (r - 0.5)*40;
    return {
      roi: baseline.roi * (1 + roiDelta/100),
      cost: baseline.cost * (1 + costDelta/100),
      risk: Math.max(0.02, Math.min(0.95, baseline.risk + riskDelta)),
      latency: Math.max(60, baseline.latency + latDelta),
      roiDelta, costDelta, riskDelta, latDelta,
    };
  }, [params]);

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 420px', gap: 1, height: '100%', background: 'var(--stroke-2)' }}>
      {/* — MAIN — */}
      <div style={{ background: 'var(--bg-base)', padding: '24px 32px', overflow: 'auto', position: 'relative' }}>
        {/* ambient grid */}
        <div style={{
          position: 'absolute', inset: 0, opacity: 0.25,
          backgroundImage: 'linear-gradient(var(--stroke-1) 1px, transparent 1px), linear-gradient(90deg, var(--stroke-1) 1px, transparent 1px)',
          backgroundSize: '48px 48px', pointerEvents: 'none',
        }}/>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 6, position: 'relative' }}>
          <div>
            <span className="mono" style={{ fontSize: 10, color: 'var(--fg-4)', letterSpacing: '0.16em' }}>CONTROL PLANE</span>
            <h1 style={{ fontSize: 32, color: 'var(--fg-1)', fontWeight: 300, margin: '6px 0 0', letterSpacing: '-0.02em' }}>Steering · Sentiment Routing</h1>
            <p style={{ color: 'var(--fg-3)', fontSize: 13, margin: '8px 0 0', maxWidth: 520 }}>Adjust operational parameters in real-time. Changes propagate to live traffic within 300ms.</p>
          </div>
          <div style={{ display: 'flex', gap: 2, padding: 3, background: 'var(--bg-inset)', border: '1px solid var(--stroke-2)', borderRadius: 4 }}>
            {['A','B','C'].map(v => (
              <button key={v} onClick={() => setVariant(v)} style={{
                padding: '6px 12px', fontSize: 11, fontWeight: 500, letterSpacing: '0.04em',
                background: variant === v ? 'var(--bg-panel-hi)' : 'transparent',
                color: variant === v ? 'var(--signal-cool)' : 'var(--fg-3)',
                border: '1px solid ' + (variant === v ? 'var(--stroke-hot)' : 'transparent'),
                borderRadius: 3,
              }} className="mono">VAR · {v}</button>
            ))}
          </div>
        </div>

        <div style={{ marginTop: 28, position: 'relative' }}>
          {variant === 'A' && <LinearVariant params={params} setParams={setParams} />}
          {variant === 'B' && <RadialVariant params={params} setParams={setParams} />}
          {variant === 'C' && <SpatialVariant params={params} setParams={setParams} />}
        </div>

        {/* Terminal */}
        <div style={{ marginTop: 32, padding: '16px 18px', background: 'var(--bg-code)', border: '1px solid var(--stroke-2)', borderRadius: 6 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <span className="mono" style={{ fontSize: 10, color: 'var(--fg-3)', letterSpacing: '0.12em' }}>LIVE OUTPUT STREAM</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}><span className="live-dot cool"/><span className="mono" style={{ fontSize: 10, color: 'var(--fg-4)' }}>LIVE</span></div>
          </div>
          <div className="mono" style={{ fontSize: 11, lineHeight: 1.9, color: 'var(--fg-3)' }}>
            <div><span style={{ color: 'var(--fg-5)' }}>10:42:01 →</span> Modifying parameter <span style={{ color: 'var(--signal-cool)' }}>[resource_allocation]</span> to {params.resource.toFixed(2)}</div>

            <div><span style={{ color: 'var(--fg-5)' }}>10:42:02 ✓</span> <span style={{ color: 'var(--signal-pos)' }}>Validation passed.</span> Latency expected: {Math.round(projected.latency)}ms</div>

            <div><span style={{ color: 'var(--fg-5)' }}>10:42:04 →</span> Awaiting commit authorization...</div>

          base={`${fmt.money(baseline.cost*1e6)}/mo`}
          projected={`${fmt.money(projected.cost*1e6)}/mo`}
          delta={fmt.pct(projected.costDelta, 1)}
          tone={projected.costDelta <= 0 ? 'pos' : 'warn'}
          invert

        <ImpactCard
          label="p95 Latency"
          base={`${Math.round(baseline.latency)}ms`}
          projected={`${Math.round(projected.latency)}ms`}
          delta={`${projected.latDelta >= 0 ? '+' : ''}${Math.round(projected.latDelta)}ms`}
          tone={projected.latDelta <= 0 ? 'pos' : 'warn'}
          invert
        />
        <ImpactCard
          label="Anomaly risk"

        <div style={{ display: 'flex', gap: 8, marginTop: 20 }}>

function Dial({ d, val, onChange }) {
  const size = 220;
  const r = size/2 - 22;
  const cx = size/2, cy = size/2;
  // arc from -135° to +135° (270° sweep)
  const start = -135 * Math.PI/180, end = 135 * Math.PI/180;
  const cur = start + val * (end - start);
  const startPt = { x: cx + r*Math.cos(start), y: cy + r*Math.sin(start) };
  const endPt = { x: cx + r*Math.cos(end), y: cy + r*Math.sin(end) };
  const curPt = { x: cx + r*Math.cos(cur), y: cy + r*Math.sin(cur) };
  const arc = (from, to) => {
    const fp = { x: cx + r*Math.cos(from), y: cy + r*Math.sin(from) };
    const tp = { x: cx + r*Math.cos(to), y: cy + r*Math.sin(to) };
    const large = (to - from) > Math.PI ? 1 : 0;
    return `M ${fp.x} ${fp.y} A ${r} ${r} 0 ${large} 1 ${tp.x} ${tp.y}`;
  };
  return (
    <div style={{ padding: 18, background: 'var(--bg-panel)', border: '1px solid var(--stroke-2)', borderRadius: 8, display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <svg width={size} height={size} style={{ cursor: 'pointer' }}
        onMouseDown={(e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          const handle = (mv) => {
            const dx = mv.clientX - (rect.left + cx), dy = mv.clientY - (rect.top + cy);
            let ang = Math.atan2(dy, dx);
            if (ang < start) ang = start;
            if (ang > end) ang = end;
            if (ang < -Math.PI/2 && dx < 0 && dy > 0) ang = end;
            const v = Math.max(0, Math.min(1, (ang - start) / (end - start)));
            onChange(v);
          };
          handle(e);
          window.addEventListener('mousemove', handle);
          window.addEventListener('mouseup', () => window.removeEventListener('mousemove', handle), { once: true });
        }}>
        <path d={arc(start, end)} stroke="var(--stroke-2)" strokeWidth="2" fill="none"/>
        <path d={arc(start, cur)} stroke={`var(--signal-${d.tone})`} strokeWidth="3" fill="none" style={{ filter: `drop-shadow(0 0 6px var(--signal-${d.tone}))` }}/>
        {/* ticks */}
        {Array.from({ length: 27 }, (_, i) => {
          const a = start + (i/26)*(end - start);
          const r1 = r+5, r2 = r + (i % 5 === 0 ? 12 : 8);
          return <line key={i} x1={cx + r1*Math.cos(a)} y1={cy + r1*Math.sin(a)} x2={cx + r2*Math.cos(a)} y2={cy + r2*Math.sin(a)} stroke="var(--stroke-3)" strokeWidth={i % 5 === 0 ? 1.2 : 0.8}/>;
        })}
        {/* needle */}
        <line x1={cx} y1={cy} x2={curPt.x} y2={curPt.y} stroke={`var(--signal-${d.tone})`} strokeWidth="2" strokeLinecap="round" style={{ filter: `drop-shadow(0 0 4px var(--signal-${d.tone}))` }}/>
        <circle cx={cx} cy={cy} r="22" fill="var(--bg-inset)" stroke="var(--stroke-3)"/>
        <circle cx={cx} cy={cy} r="4" fill={`var(--signal-${d.tone})`}/>
        <text x={cx} y={cy+50} textAnchor="middle" fill={`var(--signal-${d.tone})`} fontSize="22" fontFamily="var(--font-mono)" fontWeight="300">{(val*100).toFixed(0)}</text>
        <text x={cx} y={cy+68} textAnchor="middle" fill="var(--fg-5)" fontSize="10" fontFamily="var(--font-mono)" letterSpacing="0.2em">%</text>
      </svg>
      <div className="mono" style={{ fontSize: 10, color: 'var(--fg-3)', letterSpacing: '0.16em', marginTop: 8 }}>{d.label}</div>
      <div style={{ fontSize: 10, color: 'var(--fg-5)', marginTop: 4 }}>{d.sub}</div>
    </div>
  );
}

// ——— VARIANT C: SPATIAL ———
function SpatialVariant({ params, setParams }) {
  const boxRef = useRef(null);
  const onDrag = (e) => {
    const rect = boxRef.current.getBoundingClientRect();
    const handle = (mv) => {
      const x = Math.max(0, Math.min(1, (mv.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, 1 - (mv.clientY - rect.top) / rect.height));
      setParams(p => ({ ...p, resource: y, velocity: x }));
    };
    handle(e);
    window.addEventListener('mousemove', handle);
    window.addEventListener('mouseup', () => window.removeEventListener('mousemove', handle), { once: true });

  return (

// ============================================
// AGENTIUM — App shell, Tweaks, Concept switcher

function App() {
  // Tweaks (persisted on page)
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "concept": "A",
    "theme": "dark",
    "density": 2,
    "motion": 7,
    "accent": "cool"
  }/*EDITMODE-END*/;

  const [tweaks, setTweaks] = useState(() => {
    try {
      const saved = localStorage.getItem('agentium:tweaks');
      if (saved) return { ...TWEAK_DEFAULTS, ...JSON.parse(saved) };
    } catch {}
    return TWEAK_DEFAULTS;
  });
  const [tweaksOpen, setTweaksOpen] = useState(false);

  const [view, setView] = useState(() => localStorage.getItem('agentium:view') || 'hypervisor');
  useEffect(() => { localStorage.setItem('agentium:view', view); }, [view]);

  useEffect(() => {
    try { localStorage.setItem('agentium:tweaks', JSON.stringify(tweaks)); } catch {}
    document.documentElement.setAttribute('data-theme', tweaks.theme);
    document.documentElement.setAttribute('data-concept', tweaks.concept);
    document.documentElement.setAttribute('data-accent', tweaks.accent);
  }, [tweaks]);

  // Tweaks edit mode protocol
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const updateTweak = (k, v) => {
    setTweaks(t => ({ ...t, [k]: v }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  // Live system state for chrome
  const throughput = useLiveNumber(2.4, { jitter: 0.04, interval: 1800 });
  const latency = useLiveNumber(420, { jitter: 0.03, interval: 1400 });
  const yieldPct = useLiveNumber(24.5, { jitter: 0.01, interval: 2400 });
  const systemState = { throughput, latency, yield: yieldPct };

  return (
    <div style={{ position: 'fixed', inset: 0, display: 'flex', flexDirection: 'column', background: 'var(--bg-base)', overflow: 'hidden' }}>
      <TitleBar view={view} setView={setView} systemState={systemState} />
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden', minHeight: 0 }}>
        <SideRail view={view} setView={setView} />
        <div data-screen-label={view.toUpperCase()} data-concept={tweaks.concept} style={{ flex: 1, minWidth: 0, overflow: 'hidden', position: 'relative' }}>
          {view === 'hypervisor' && <Hypervisor systemState={systemState} />}
          {view === 'zoom' && <ZoomView onGoToSteering={() => setView('steering')} onGoToRun={() => setView('run')} />}
          {view === 'steering' && <SteeringView />}
          {view === 'builder' && <BuilderView />}
          {view === 'run' && <RunView />}

          {/* Concept label (top-right floating) */}
          <ConceptBadge concept={tweaks.concept} />
        </div>
      </div>

      {tweaksOpen && <TweaksPanel tweaks={tweaks} onChange={updateTweak} onClose={() => setTweaksOpen(false)} />}

      <BottomCommand view={view} />
    </div>
  );
}

        <input type="range" min="1" max="10" value={tweaks.motion} onChange={e => onChange('motion', parseInt(e.target.value))} style={{ width: '100%', accentColor: '#7dd3fc' }}/>
      </TweakRow>

      <div style={{ marginTop: 14, padding: '10px 12px', background: 'var(--bg-inset)', borderRadius: 4, fontSize: 10, color: 'var(--fg-4)', lineHeight: 1.6 }}>
        Cycle concepts A→D to see visual direction explorations. All views work in every concept. Light theme for comparison.
      </div>
    </div>
  );
}

function TweakRow({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <div className="mono" style={{ fontSize: 10, color: 'var(--fg-4)', letterSpacing: '0.12em', marginBottom: 8, textTransform: 'uppercase' }}>{label}</div>
      {children}
    </div>
  );
}

// MOUNT
ReactDOM.createRoot(document.getElementById('root')).render(<App />);


</script>
</body>
</html>
