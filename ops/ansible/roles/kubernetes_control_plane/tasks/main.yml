---
- name: Check whether kubeadm already initialised this node
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kube_admin_conf

- name: Initialise kubeadm
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --control-plane-endpoint={{ ansible_host }}:6443
  args:
    creates: /etc/kubernetes/admin.conf
  when: not kube_admin_conf.stat.exists
  register: kubeadm_init

- name: Install Helm on the control plane
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts:
      - --strip-components=1
      - linux-amd64/helm
    creates: /usr/local/bin/helm
