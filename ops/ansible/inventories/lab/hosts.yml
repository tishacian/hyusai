# Replace ansible_host values with `terraform output -raw ansible_inventory`
# or merge that file as terraform_inventory.yml in this directory.
all:
  children:
    kube_control_plane:
      hosts:
        agentium-lab-cp-1:
          ansible_host: 127.0.0.1
          ansible_user: ubuntu
    kube_workers:
      hosts:
        agentium-lab-wk-1:
          ansible_host: 127.0.0.1
          ansible_user: ubuntu
        agentium-lab-wk-2:
          ansible_host: 127.0.0.1
          ansible_user: ubuntu
    kube_cluster:
      children:
        kube_control_plane: {}
        kube_workers: {}
    helm_deploy:
      children:
        kube_control_plane: {}
