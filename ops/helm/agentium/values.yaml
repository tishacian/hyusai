# :local is for `helm template` only. Lab/prod overlays and the CI artifact
# values-ci-images.yaml must use @sha256: or a SHA12 tag, same contract as
# docker/compose.agentium.registry.yml.
image:
  pullPolicy: IfNotPresent
  frontend: agentium-frontend:local
  backend: agentium-backend:local
  worker: agentium-worker:local

# Provider CSI class from Terraform (`storage_class`). Empty keeps the
# cluster default. Per-service persistence.storageClass wins when set.
storageClass: ""

imagePullSecrets: []

replicaCount:
  frontend: 1
  backend: 1
  worker: 1
  p4Maintenance: 1
  keycloak: 1

frontend:
  enabled: true
  port: 8080

backend:
  enabled: true
  port: 8000
  workers: 3
  extraEnv: []

worker:
  enabled: true
  # The recipe env cache is node-local and rebuilds itself. Size it for the
  # service's own quota plus the pip cache that shares the directory.
  recipeEnvsSizeLimit: 14Gi
  # One worker consumes both pools. Compose splits them so a long recipe
  # cannot fill the CPU pool; this chart has a single worker, and a recipes
  # task with nobody listening stays queued forever.
  queues: cpu,recipes
  concurrency: 2
  beat: "1"

p4Maintenance:
  enabled: true

migrate:
  enabled: true
  # post-install so the Secret and Postgres STS exist before the Job runs.
  hook: post-install,post-upgrade
  waitForPostgres: true

rabbitmq:
  enabled: true
  image: rabbitmq:4.1-management
  user: guest
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

postgres:
  enabled: true
  image: postgres:17
  database: agentium
  user: agentium
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""

minio:
  enabled: true
  rootUser: agentium
  initImage: minio/mc:RELEASE.2025-04-16T18-13-26Z
  image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.12.5-unprivileged
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""

keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.1.4
  httpRelativePath: /kc/

ingress:
  enabled: true
  className: nginx
  host: agentium.example
  hiddenPathGuard: true
  annotations: {}
  tls: []
  # tls:
  #   - secretName: agentium-tls
  #     hosts: [agentium.example]

# Compose profiles. Stay off until the chart grows matching templates.
livekit:
  enabled: false
sftp:
  enabled: false
beat:
  enabled: false

# Local model server. Off on the lab chart. values-local.yaml turns it on
# and points chat + embeddings at it. The model portal can still route a
# workspace to a cloud provider.
ollama:
  enabled: false
  image: ollama/ollama:0.34.2
  chatModel: qwen3.5:4b
  embedModel: nomic-embed-text
  embedDimension: 768
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

# NVIDIA-only OpenAI-compatible server. The portal already lists vLLM as an
# engine. Leave this off on a Mac and on a CPU node pool.
vllm:
  enabled: false
  image: vllm/vllm-openai:v0.19.1
  model: Qwen/Qwen3.5-4B
  gpu: 1

# Application env that is not secret. Secrets go in existingSecret or
# the generated Secret when createSecret is true.
config:
  AGENTIUM_DISABLE_DOTENV: "1"
  STARTUP_RECONCILIATION: enabled

# true only for local `helm template`. Lab/prod set existingSecret and
# createSecret: false so no password is committed for a real env.
createSecret: true
# When createSecret is true these placeholders are rendered. Replace them
# before any shared environment; they are not production values.
secret:
  AGENTIUM_POSTGRES_PASSWORD: change-me
  AGENTIUM_RABBITMQ_PASSWORD: guest
  AGENTIUM_MINIO_ROOT_PASSWORD: change-me-minio-password
  OBJECT_STORE_S3_SECRET_KEY: change-me-agentium-app-password

existingSecret: ""

# Artifact store. "s3" points the application at object storage instead of a
# filesystem, which is what lets backend, worker and maintenance share it
# without a ReadWriteMany volume. The endpoint is the in-cluster MinIO by
# default and is the only line to change for OVH Object Storage, Ceph or any
# other S3 implementation.
objectStore:
  backend: s3
  bucket: agentium-artifacts
  endpointUrl: http://agentium-minio:9000
  accessKey: agentium-app
  policyName: agentium-app-policy

# Requests are what the scheduler reserves; memory limits are what stop one
# container taking a node down with it. CPU limits are deliberately absent:
# CPU is compressible, and throttling a request path costs more than it
# protects. These are starting points sized for the lab, not measurements.
resources:
  frontend:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  backend:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 4Gi}
  worker:
    requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 14Gi}
    limits: {memory: 6Gi, ephemeral-storage: 16Gi}
  p4Maintenance:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
  migrate:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 2Gi}
  waitPostgres:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  postgres:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  qdrant:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}
  minio:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  minioInit:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  rabbitmq:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  keycloak:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
  ollama:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 8Gi}
  vllm:
    requests: {cpu: 1, memory: 4Gi}
    limits: {memory: 16Gi}

# A single-replica stateful service cannot be evicted without losing data, so
# a drain must refuse rather than proceed. Turn this off only when you have
# decided that a node drain may take Postgres down.
podDisruptionBudget:
  enabled: true
# Not consumed by any template yet. They become meaningful with the node
# pools of the subscription model; until then they are placeholders.
nodeSelector: {}
tolerations: []
affinity: {}
