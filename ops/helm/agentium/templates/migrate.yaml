{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: agentium-migrate
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- include "agentium.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ .Values.image.backend | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "agentium.fullname" . }}-config
            - secretRef:
                name: {{ include "agentium.secretName" . }}
{{- end }}
