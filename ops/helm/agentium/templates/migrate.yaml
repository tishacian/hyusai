{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: agentium-migrate
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if .Values.migrate.hook }}
  annotations:
    helm.sh/hook: {{ .Values.migrate.hook | quote }}
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- include "agentium.imagePullSecrets" . | nindent 6 }}
      {{- if and .Values.migrate.waitForPostgres .Values.postgres.enabled }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image | quote }}
          {{- with .Values.resources.waitPostgres }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h agentium-pg -U {{ .Values.postgres.user | quote }} -d {{ .Values.postgres.database | quote }}; do sleep 2; done
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.image.backend | quote }}
          {{- with .Values.resources.migrate }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "agentium.fullname" . }}-config
            - secretRef:
                name: {{ include "agentium.secretName" . }}
{{- end }}
