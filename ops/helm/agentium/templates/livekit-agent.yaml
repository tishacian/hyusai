{{- if and .Values.livekit.enabled .Values.livekit.agent.enabled }}
{{/*
agentium-livekit-agent, Compose profile realtime: joins a room when the API
POSTs /dispatch. The dispatch carries the room token, so the sidecar holds no
LiveKit key. It reads OPENAI_API_KEY alone from the application Secret, for
realtime STT, and falls back to batch STT without it. Sessions live in
memory: one replica.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentium-livekit-agent
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: livekit-agent
  template:
    metadata:
      labels:
        {{- include "agentium.labels" . | nindent 8 }}
        app.kubernetes.io/component: livekit-agent
    spec:
      {{- include "agentium.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runtime.uid }}
        runAsGroup: {{ .Values.runtime.gid }}
      containers:
        - name: livekit-agent
          image: {{ .Values.image.livekitAgent | quote }}
          {{- with .Values.resources.livekitAgent }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `npm run start` writes its log under HOME; the root filesystem is read-only.
          command: ["node", "src/agent.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LIVEKIT_AGENT_HOST
              value: 0.0.0.0
            - name: LIVEKIT_AGENT_PORT
              value: "8090"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentium.secretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: agentium-livekit-agent
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit-agent
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: livekit-agent
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- if .Values.livekit.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentium-livekit-agent
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: livekit-agent
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
      ports:
        - port: 8090
          protocol: TCP
{{- end }}
{{- end }}
