{{- if .Values.worker.enabled }}
{{- if has "dataops" (splitList "," (replace " " "" .Values.worker.queues)) }}
{{- fail "worker.queues must exclude dataops; use dataopsWorker.enabled" }}
{{- end }}
{{- range list "connectors" "connectors_interactive" }}
{{- if has . (splitList "," (replace " " "" $.Values.worker.queues)) }}
{{- fail "worker.queues must exclude connector queues; use connectorWorkers.enabled" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentium-worker
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "agentium.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "agentium.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ .Values.image.worker | quote }}
          {{- with .Values.resources.worker }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "agentium.fullname" . }}-config
            - secretRef:
                name: {{ include "agentium.secretName" . }}
            {{- include "agentium.openbaoEnvFrom" (list . "worker") | nindent 12 }}
          env:
            {{- include "agentium.appSecretEnv" . | nindent 12 }}
            {{- include "agentium.openbaoEnv" (list .) | nindent 12 }}
            {{- if .Values.huggingface.enabled }}
            {{- include "agentium.hfOfflineEnv" . | nindent 12 }}
            {{- include "agentium.hfSigningEnv" (list .) | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: recipe-envs
              mountPath: /data/recipe_envs
            {{- include "agentium.hfVolumeMounts" (list . "worker") | nindent 12 }}
      {{- if .Values.huggingface.enabled }}
      securityContext:
        fsGroup: {{ .Values.runtime.gid }}
      {{- end }}
      volumes:
        {{- include "agentium.hfVolumes" (list . "worker") | nindent 8 }}
        # Content-addressed virtualenvs plus the pip cache. The service evicts
        # them on its own against a quota and an idle TTL, so this is a cache,
        # not state: a pod that starts empty rebuilds what it needs. Node-local
        # on purpose, so replicas never contend for one filesystem.
        - name: recipe-envs
          emptyDir:
            sizeLimit: {{ .Values.worker.recipeEnvsSizeLimit }}
{{- end }}
