{{- if .Values.dataopsWatchdog.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentium-dataops-watchdog
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataops-watchdog
spec:
  schedule: {{ .Values.dataopsWatchdog.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.dataopsWatchdog.deadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.dataopsWatchdog.deadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "agentium.labels" . | nindent 12 }}
            app.kubernetes.io/component: dataops-watchdog
        spec:
          restartPolicy: Never
          {{- include "agentium.imagePullSecrets" . | nindent 10 }}
          containers:
            - name: watchdog
              image: {{ .Values.image.worker | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "scripts.dataops_watchdog"]
              args: ["--probe-queue"]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
              envFrom:
                - configMapRef:
                    name: {{ include "agentium.fullname" . }}-config
                - secretRef:
                    name: {{ include "agentium.secretName" . }}
                {{- include "agentium.openbaoEnvFrom" (list . "worker") | nindent 16 }}
              env:
                {{- include "agentium.appSecretEnv" . | nindent 16 }}
                {{- include "agentium.openbaoEnv" (list .) | nindent 16 }}
{{- end }}
