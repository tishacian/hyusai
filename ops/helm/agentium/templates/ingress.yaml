{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentium.fullname" . }}
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.hiddenPathGuard }}
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~ ^(?!/kc/)(?!/\.well-known/acme-challenge/)(?:.*/)?\. {
        return 404;
      }
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: agentium-backend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentium-backend
                port:
                  name: http
          - path: /kc
            pathType: Prefix
            backend:
              service:
                name: agentium-kc
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentium-frontend
                port:
                  name: http
{{- if .Values.livekit.enabled }}
{{/*
LiveKit signalling on its own host at /, so no Ingress needs a rewrite: in
ingress-nginx a rewrite turns every path of its host into a regex.
ingress.annotations (e.g. a cert-manager issuer) apply here too.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentium.fullname" . }}-livekit
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit
  annotations:
    {{- $websocket := dict "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" "nginx.ingress.kubernetes.io/proxy-buffering" "off" }}
    {{- toYaml (merge $websocket (deepCopy (.Values.ingress.annotations | default dict))) | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.livekit.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.livekit.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentium-livekit
                port:
                  name: http
{{- end }}
{{- end }}
