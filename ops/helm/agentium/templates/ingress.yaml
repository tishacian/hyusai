{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentium.fullname" . }}
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.hiddenPathGuard }}
    nginx.ingress.kubernetes.io/server-snippet: |
      location ~ ^(?!/kc/)(?!/\.well-known/acme-challenge/)(?:.*/)?\. {
        return 404;
      }
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: agentium-backend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentium-backend
                port:
                  name: http
          - path: /kc
            pathType: Prefix
            backend:
              service:
                name: agentium-kc
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentium-frontend
                port:
                  name: http
{{- if .Values.livekit.enabled }}
{{/*
/livekit/ → LiveKit :7880 with the prefix stripped, as the VM nginx does. The
rewrite is per Ingress, hence a second one on the same host. ingress-nginx
then matches every path of the host as a case-insensitive regex.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentium.fullname" . }}-livekit
  labels:
    {{- include "agentium.labels" . | nindent 4 }}
    app.kubernetes.io/component: livekit
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /livekit(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agentium-livekit
                port:
                  name: http
{{- end }}
{{- end }}
