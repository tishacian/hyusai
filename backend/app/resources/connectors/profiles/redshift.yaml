key: redshift
version: 1
label_key: connections.profile.redshift
family: dbapi
dialect: redshift
packages:
- psycopg2
parameters:
- key: host
  type: host
  required: true
- key: port
  type: integer
  default: 5439
  min: 1
  max: 65535
- key: database
  type: string
  required: true
- key: username
  type: string
  required: true
- key: password
  type: secret
  required: true
- key: schema
  type: string
  default: public
capabilities:
  read: true
  read_partitioned: true
  read_incremental: true
  consistency: none
  write_append: true
  write_upsert: true
  write_outcome_check: marker_table
limits:
  preview_rows: 100
  statement_timeout_ms: 30000
  fetch_rows: 1000
