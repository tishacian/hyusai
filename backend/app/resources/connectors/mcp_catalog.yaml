# Official publisher endpoints. Listing is not a qualification or account grant.
version: 1
servers:
  - key: github
    publisher: GitHub
    url: https://api.githubcopilot.com/mcp/
    documentation: https://docs.github.com/en/copilot/customizing-copilot/using-model-context-protocol/using-the-github-mcp-server
    auth_mode: bearer
    tool_allowlist: [get_file_contents, search_code, list_issues, list_pull_requests]
    write_tools: []
    data_location: Provider account and hosting terms apply.
  - key: notion
    publisher: Notion
    url: https://mcp.notion.com/mcp
    documentation: https://developers.notion.com/docs/mcp
    auth_mode: oauth_user
    tool_allowlist: [notion-search, notion-fetch]
    write_tools: []
    data_location: Provider account and hosting terms apply.
  - key: atlassian
    publisher: Atlassian
    url: https://mcp.atlassian.com/v1/mcp
    documentation: https://support.atlassian.com/atlassian-rovo-mcp-server/
    auth_mode: oauth_user
    tool_allowlist: [search, fetch]
    write_tools: []
    data_location: Provider account and hosting terms apply.
