executeActionsSubject=[Agentium] Update Your Account
executeActionsBodyHtml=<p>Hello,</p><p>Your administrator has requested an action on your Agentium account. Click the link below to proceed.</p><p><a href="{0}">Update my account</a></p><p>This link will expire in {2} minutes.</p><p>If you did not expect this, you can safely ignore this email.</p><p>— The Agentium team</p>
executeActionsBody=Your Agentium administrator has requested an action on your account. Open the link below to proceed:\n\n{0}\n\nThis link will expire in {2} minutes. If you did not expect this, ignore this email.\n\n— The Agentium team

passwordResetSubject=[Agentium] Reset Your Password
passwordResetBodyHtml=<p>Hello,</p><p>Someone (hopefully you) requested a password reset for your Agentium account. Click the link below to set a new password.</p><p><a href="{0}">Reset my password</a></p><p>This link will expire in {2} minutes.</p><p>If you didn''t request this, ignore this email — nothing will change.</p><p>— The Agentium team</p>
passwordResetBody=Someone (hopefully you) requested a password reset for your Agentium account. Open the link below to set a new password:\n\n{0}\n\nThis link will expire in {2} minutes. If you didn''t request this, ignore this email.\n\n— The Agentium team

