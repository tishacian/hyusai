<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Agentium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070A10">
  <meta name="description" content="Agentium — the professional AI orchestration platform">
  <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    >
  </noscript>
  <script>
    // Runs before Angular bootstraps to avoid any FOUC. Agentium is currently
    // pinned to the dark theme because light-mode contrast is not demo-safe.
    (function () {
      var root = document.documentElement;
      root.classList.add('dark');
      root.setAttribute('data-theme', 'dark');
      try {
        localStorage.setItem('agentium_theme', 'dark');
      } catch (e) {
        // Ignore quota/privacy errors.
      }
    })();
  </script>
</head>
<body class="font-sans antialiased text-gray-100">
  <app-root></app-root>
</body>
</html>
