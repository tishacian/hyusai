<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Agentium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00bcd4">
  <meta name="description" content="Agentium — the professional AI orchestration platform">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    >
  </noscript>
  <script>
    // Runs before Angular bootstraps to avoid any FOUC. If the user has
    // previously pinned a theme ("light" / "dark") we honour it; otherwise we
    // fall back to the OS preference via `prefers-color-scheme`.
    (function () {
      try {
        var stored = localStorage.getItem('agentium_theme');
        var prefersLight = false;
        if (stored === 'light') {
          prefersLight = true;
        } else if (stored === 'dark') {
          prefersLight = false;
        } else if (window.matchMedia) {
          prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        }
        var root = document.documentElement;
        if (prefersLight) {
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
        } else {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="font-sans antialiased text-gray-100">
  <app-root></app-root>
</body>
</html>
