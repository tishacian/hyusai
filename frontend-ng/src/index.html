<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <title>Agentium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00bcd4">
  <meta name="description" content="Agentium — the professional AI orchestration platform">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Inter+Tight:wght@300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    >
  </noscript>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('agentium_theme');
        var isLight = t === 'light';
        if (isLight) {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="font-sans antialiased text-gray-100">
  <app-root></app-root>
</body>
</html>
