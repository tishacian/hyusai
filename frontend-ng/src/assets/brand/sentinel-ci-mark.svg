<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SENTINEL-CI - icone elephant</title>
  <desc id="desc">Icone vectorielle avec un elephant stylise pour SENTINEL-CI, outil de monitoring politique et gouvernemental de la Republique de Cote d'Ivoire.</desc>
  <defs>
    <linearGradient id="ciRing" x1="9" y1="11" x2="87" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F29B38"/>
      <stop offset="0.46" stop-color="#F7F1E3"/>
      <stop offset="1" stop-color="#2FC56C"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(48 48) rotate(90) scale(42)">
      <stop offset="0" stop-color="#2FC56C" stop-opacity="0.26"/>
      <stop offset="0.58" stop-color="#10231C" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#07100E"/>
    </radialGradient>
    <linearGradient id="elephantFill" x1="31" y1="29" x2="70" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E8"/>
      <stop offset="1" stop-color="#BFC8B8"/>
    </linearGradient>
    <filter id="softGlow" x="-30" y="-30" width="156" height="156" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.77 0 0 0 0 0.42 0 0 0 0.48 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

