# Canonical nginx config after frontend and backend both run behind Docker.
#
# Difference from deploy/nginx/agentium-container-backend.conf:
# - / proxies to the frontend container on 127.0.0.1:8081
# - /api/ and /api/v1/deposit-links/ stay on the backend container at 8001
# - /legacy/ stays available on the systemd backend at 8000 during rollout
#
# SFTP is not proxied by nginx and must remain managed by agentium-sftp.service.
server {
    server_name agentium.papai.ai;
    client_max_body_size 50M;

    location /legacy/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/deposit-links/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        client_max_body_size 32G;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location ^~ /api/v1/voice/sessions/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /livekit {
        return 308 /livekit/;
    }

    location ^~ /livekit/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:7880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location ^~ /kc/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx instance is the public edge: overwrite, rather than
        # append, client-controlled proxy identity headers before Keycloak.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reject hidden path segments at the public edge instead of proxying them
    # to the frontend SPA, which would otherwise answer index.html with 200.
    # The sole exception lets certbot's temporary ACME location take over.
    location ~ ^(?!/\.well-known/acme-challenge/)(?:.*/)?\. {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/agentium.papai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentium.papai.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = agentium.papai.ai) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name agentium.papai.ai;
    return 404;
}
