# Canonical nginx config for the omnirag-demo VM.
#
# Copy to /etc/nginx/sites-enabled/agentium and reload nginx. The TLS
# cert paths assume certbot has already been run with:
#   sudo certbot --nginx -d agentium.papai.ai
#
# IMPORTANT: the order (and modifiers) of the `location` blocks matter.
# See the comment above the `/kc/` block below.
server {
    server_name agentium.papai.ai;
    client_max_body_size 50M;

    # Angular static files
    root /var/www/agentium;
    index index.html;

    # Legacy vanilla frontend (backup access)
    location /legacy/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Secure Deposit uploads can carry large supplier ZIPs.
    location ^~ /api/v1/deposit-links/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        client_max_body_size 32G;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    location ^~ /api/v1/voice/sessions/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API + auth
    location /api/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }

    # Keycloak admin + OIDC endpoints.
    #
    # The ^~ modifier is CRITICAL: without it, the regex location
    # further down (.(js|css|woff2?|...)$) takes precedence over this
    # prefix location, and requests like
    # /kc/resources/xxxx/admin/keycloak.v2/assets/main.css get served
    # from /var/www/agentium instead of being proxied to Keycloak,
    # returning 404 and breaking the admin console entirely.
    location ^~ /kc/ {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx instance is the public edge: overwrite, rather than
        # append, client-controlled proxy identity headers before Keycloak.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Server "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never let the SPA fallback turn probes for hidden files into a
    # successful index.html response. Match hidden path segments at any depth
    # (/.env, /.git/config, /assets/.secret, ...), while leaving only the
    # root ACME challenge namespace available to certbot's temporary location.
    location ~ ^(?!/\.well-known/acme-challenge/)(?:.*/)?\. {
        return 404;
    }

    # Angular SPA fallback
    location / {
        include /etc/nginx/snippets/agentium-deploy-maintenance.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # pdf.js (ngx-extended-pdf-viewer) ships its worker/viewer as ES modules
    # (.mjs) plus a .wasm blob. nginx 1.24 mime.types maps neither, so they'd be
    # served as application/octet-stream and the browser rejects ES module
    # scripts under strict MIME checking. default_type fixes the Content-Type
    # without redefining the inherited mime.types for every other asset.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Long cache for hashed JS/CSS (SPA assets only — see the ^~ note
    # on /kc/ above for why this doesn't steal Keycloak assets).
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/agentium.papai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentium.papai.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = agentium.papai.ai) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name agentium.papai.ai;
    return 404;
}
