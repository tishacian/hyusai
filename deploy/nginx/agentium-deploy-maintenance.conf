# Included inside every public location that can reach an Agentium writer.
#
# The deployment runner creates /var/lib/agentium/deploy-maintenance while the
# database and dependent stores are quiesced.  Requests issued locally on the
# VM remain available for health checks and authenticated canaries; every
# external request is rejected before it reaches the backend. The safe runner
# uses the dedicated loopback destination 127.0.0.2. Binding the exception to
# that destination prevents a local reverse proxy from laundering an external
# source address into the canary exception.
set $agentium_deploy_maintenance 0;

if (-f /var/lib/agentium/deploy-maintenance) {
    set $agentium_deploy_maintenance 1;
}

if ($server_addr = 127.0.0.2) {
    set $agentium_deploy_maintenance 0;
}

if ($agentium_deploy_maintenance = 1) {
    add_header Retry-After "60" always;
    add_header Cache-Control "no-store" always;
    return 503 '{"detail":"Agentium is temporarily unavailable during a controlled deployment."}';
}
